# This is a template. deploy-preview-web.sh replaces the hostname only after
# validating a signed-release-compatible Tailscale DNS name.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 127.0.0.1:8080;
    server_name __MEETWISE_PREVIEW_HOST__;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    default_type application/json;

    # This runs before location proxying. No unsafe request reaches Next.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 503 '{"error":"public_preview_read_only"}';
    }

    # Only display pages are reachable. In particular, /api, login, all
    # account routes, RSC routes for those pages, and unknown paths are not
    # public preview surface.
    location = / {
        if ($request_method = OPTIONS) { add_header Allow "GET, HEAD, OPTIONS" always; add_header Content-Length 0; return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host __MEETWISE_PREVIEW_HOST__;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location = /features {
        if ($request_method = OPTIONS) { add_header Allow "GET, HEAD, OPTIONS" always; add_header Content-Length 0; return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host __MEETWISE_PREVIEW_HOST__;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location = /faq {
        if ($request_method = OPTIONS) { add_header Allow "GET, HEAD, OPTIONS" always; add_header Content-Length 0; return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host __MEETWISE_PREVIEW_HOST__;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location = /legal {
        if ($request_method = OPTIONS) { add_header Allow "GET, HEAD, OPTIONS" always; add_header Content-Length 0; return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host __MEETWISE_PREVIEW_HOST__;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /_next/static/ {
        if ($request_method = OPTIONS) { add_header Allow "GET, HEAD, OPTIONS" always; add_header Content-Length 0; return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host __MEETWISE_PREVIEW_HOST__;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A signed, non-sensitive release record is the only control-plane
    # document that Pages may fetch. It is never proxied to Next.js.
    location = /preview-release-manifest.json {
        alias /usr/share/meetwise-preview/preview-release-manifest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
