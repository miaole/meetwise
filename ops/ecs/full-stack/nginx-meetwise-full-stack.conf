server {
    listen 127.0.0.1:80;
    server_name 47.98.189.166 izbp17r57q9ife3hdx9hc6z.tail39416d.ts.net;

    client_max_body_size 1m;

    location = /preview-release-manifest.json {
        alias /usr/share/meetwise-preview/preview-release-manifest.json;
        default_type application/json;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
