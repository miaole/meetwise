server {
    listen 127.0.0.1:80;
    server_tokens off;
    server_name _;  # 部署时替换为实际域名/ECS 边缘入口（不回写真实 IP 或实例 ID）

    client_max_body_size 1m;

    location = /preview-release-manifest.json {
        alias /usr/share/meetwise-preview/preview-release-manifest.json;
        default_type application/json;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
