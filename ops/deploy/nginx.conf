# 精简 CD —— 宿主 nginx:恒定反代 compose 里的 web（HA-1 起双 web 后端）。
# 公网入口:Tailscale HTTPS Funnel → 127.0.0.1:80(本 server)→ upstream web_pool(web-a/web-b 容器)。
# 去掉了旧 funnel/Pages 的 preview-release-manifest 门控与「按回执启停」逻辑 ——
# 单机 demo 恒定服务即可,不需要按签名回执动态开关公网。
#
# HA-1 R-17 改造（rev2 §9-5 勘误②口径）：原文件【无 upstream{} 块】——location / 内
# proxy_pass http://127.0.0.1:3000 直连单后端；本改造=新增 upstream web_pool 双后端
# （web-a=127.0.0.1:3000 / web-b=127.0.0.1:3001，compose.ha.yml 宿主回环绑定），属新增非升级。
# SSE 约束原样保留：proxy_buffering off + proxy_read_timeout 3600s。
#
# 被动探活：max_fails=3 / fail_timeout=15s —— 连续 3 次失败摘除 15s；连接失败请求由
# proxy_next_upstream（默认 error timeout）即时转交存活后端。单副本 down 窗口内新连接
# 不进死副本（本刀 drain 语义=探活摘除，SIGTERM in-flight 排空归 R-18/19）。

upstream web_pool {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=15s;
}

server {
    # default_server:抢过发行版自带的 /usr/share/nginx/html 默认站点,否则 Funnel
    # 流量会命中欢迎页(/ 返回 200 假象、/login 等 404)。bootstrap 会摘掉发行版
    # nginx.conf 里那个 default_server,保证同址只有本 server 是默认。
    listen 127.0.0.1:80 default_server;
    server_name _;  # 部署时替换为实际域名/边缘入口

    # SSE(面试进度等)需要禁用缓冲 + 长超时,否则事件流会被 nginx 攒着不发。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://web_pool;
        proxy_buffering off;   # 流式响应即时下发
        add_header X-HA-Upstream $upstream_addr always;
    }
}
