name: deploy-full-stack

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

# Serialize deploys: a second push while one is mid-flight must queue, never interleave.
concurrency:
  group: full-stack-deploy
  cancel-in-progress: false

# Deployment-control migration is explicit: the fixed external target below currently
# supplies only the independent public-probe signer/receipt. Until it exposes the full
# transaction contract, this repository is the temporary ACR/ECS orchestration fallback;
# no alternate/unpinned target is attempted, and an unavailable/failed target leaves the
# transaction unconfirmed so token-bound recovery keeps the edge fail-closed.
jobs:
  deploy-probe:
    # Only the real repository (where the deploy key, Tailscale OAuth, ACR, and the
    # gitignored Pages origin live) may reach the protected preview-cd environment.
    # Forks and PRs never run this; no deployment credential is repo-scoped.
    if: >-
      github.repository == 'miaole/meetwise' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: preview-cd
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      origin: ${{ steps.probe.outputs.origin }}
      probe_nonce: ${{ steps.probe.outputs.probe_nonce }}
      expected_manifest_sha256: ${{ steps.probe.outputs.expected_manifest_sha256 }}
      release: ${{ steps.release.outputs.release }}
      transaction_id: ${{ steps.release.outputs.transaction_id }}
      generation: ${{ steps.transaction.outputs.generation }}
      recovery_token: ${{ steps.release.outputs.recovery_token }}
      commit: ${{ steps.git.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 10.18.0

      - name: Verify CD control-plane contracts before any external mutation
        run: |
          node scripts/cd-pages-receipt.proof.mjs
          node scripts/ecs-full-stack-release.proof.mjs
          node scripts/verify-full-stack-public-origin.proof.mjs

      - name: Resolve commit + tree identity
        id: git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_sha='${{ github.event.workflow_run.head_sha }}'
          ci_run_id='${{ github.event.workflow_run.id }}'
          ci_workflow_id='${{ github.event.workflow_run.workflow_id }}'
          [[ "$ci_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'workflow_run SHA is not a commit identity' >&2; exit 1; }
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ && "$ci_workflow_id" =~ ^[1-9][0-9]*$ ]] || { echo 'workflow_run identity is not numeric' >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id")"
          test "$(jq -r .id <<<"$run_json")" = "$ci_run_id" || { echo 'workflow_run id mismatch' >&2; exit 1; }
          test "$(jq -r .workflow_id <<<"$run_json")" = "$ci_workflow_id" || { echo 'workflow_run workflow id mismatch' >&2; exit 1; }
          test "$(jq -r .head_sha <<<"$run_json")" = "$ci_sha" || { echo 'workflow_run head SHA mismatch' >&2; exit 1; }
          test "$(jq -r .head_branch <<<"$run_json")" = main || { echo 'workflow_run branch mismatch' >&2; exit 1; }
          test "$(jq -r .event <<<"$run_json")" = push || { echo 'workflow_run event mismatch' >&2; exit 1; }
          test "$(jq -r .conclusion <<<"$run_json")" = success || { echo 'workflow_run conclusion mismatch' >&2; exit 1; }
          workflow_inventory="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          ci_count="$(jq '[.[].workflows[] | select(.name == "ci")] | length' <<<"$workflow_inventory")"
          test "$ci_count" = 1 || { echo 'exactly one workflow named ci is required' >&2; exit 1; }
          ci_path="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].path' <<<"$workflow_inventory")"
          test "$ci_path" = .github/workflows/ci.yml || { echo 'workflow named ci is not the protected ci.yml' >&2; exit 1; }
          live_workflow_id="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].id' <<<"$workflow_inventory")"
          test "$live_workflow_id" = "$ci_workflow_id" || { echo 'successful run is not from the unique ci workflow' >&2; exit 1; }
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$ci_sha" || { echo 'checkout does not match the successful CI SHA' >&2; exit 1; }
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$ci_sha" = "$current_main" || { echo 'stale main deployment rejected' >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ci_sha=$ci_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "ci_workflow_id=$ci_workflow_id" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies (no lifecycle scripts)
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      # compose 单机：镜像在 CI 构建 + 推送（web 的 next build 移出 4G ECS），
      # 用 @sha256 内容摘要钉死 runtime 身份。tag 只作构建定位，摘要才是审批绑定的事实。
      - name: Build + push images to ACR
        id: images
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          printf '%s\n' "${{ secrets.ACR_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
          sha="${{ steps.git.outputs.commit }}"
          backend_tag="$REGISTRY/$NAMESPACE/meetwise-backend:sha-$sha"
          web_tag="$REGISTRY/$NAMESPACE/meetwise-web:sha-$sha"
          docker build --build-arg "VCS_REF=$sha" --build-arg "SOURCE_TREE=${{ steps.git.outputs.tree }}" -t "$backend_tag" -f Dockerfile .
          docker push "$backend_tag"
          docker build --build-arg "VCS_REF=$sha" --build-arg "SOURCE_TREE=${{ steps.git.outputs.tree }}" -t "$web_tag" -f apps/web/Dockerfile .
          docker push "$web_tag"
          backend_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$backend_tag" | sed -E 's/^.*@(sha256:[a-f0-9]{64})$/\1/')"
          web_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$web_tag" | sed -E 's/^.*@(sha256:[a-f0-9]{64})$/\1/')"
          test -n "$backend_digest" -a -n "$web_digest" -a "$backend_digest" != "$backend_tag" -a "$web_digest" != "$web_tag" \
            || { echo "digest extraction failed" >&2; exit 1; }
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "web_digest=$web_digest" >> "$GITHUB_OUTPUT"

      - name: Compute attestation digests from the actual Web image
        id: web
        run: |
          container="$(docker create "$REGISTRY/$NAMESPACE/meetwise-web:sha-${{ steps.git.outputs.commit }}")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          # Copy the complete /app boundary so standalone Next.js symlinks such
          # as apps/web/node_modules/next -> ../../../node_modules/... remain
          # inside the extracted image tree.  Copying apps/web in isolation is
          # rejected by docker cp as an escaping symlink even though the link is
          # valid inside the built image.
          mkdir -p /tmp/web-image-app
          docker cp "$container:/app/." /tmp/web-image-app/
          # This is deliberately a fixed inline control-plane hash, not code
          # loaded from the candidate checkout after ACR credentials exist.
          node --input-type=module - /tmp/web-image-app/apps/web "$GITHUB_OUTPUT" <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFile, lstat, readFile, readdir, readlink } from 'node:fs/promises';
          import { relative, resolve, sep } from 'node:path';

          const [runtimeRoot, output] = process.argv.slice(2);
          if (!runtimeRoot || !output) throw new Error('web_runtime_hash_arguments_invalid');
          async function collect(directory, root = directory) {
            const rows = [];
            for (const entry of (await readdir(directory, { withFileTypes: true })).sort((a, b) => a.name.localeCompare(b.name))) {
              const path = resolve(directory, entry.name);
              if (entry.isDirectory()) rows.push(...await collect(path, root));
              else if (entry.isFile() || entry.isSymbolicLink()) rows.push(relative(root, path).split(sep).join('/'));
              else throw new Error('web_runtime_artifact_unsupported_entry');
            }
            return rows;
          }
          async function treeDigest(directory) {
            const hash = createHash('sha256');
            for (const file of await collect(directory)) {
              const path = resolve(directory, file);
              const stat = await lstat(path);
              hash.update(`${file}\0`);
              hash.update(stat.isSymbolicLink() ? `symlink:${await readlink(path)}` : await readFile(path));
            }
            return hash.digest('hex');
          }
          const root = resolve(runtimeRoot);
          await lstat(resolve(root, 'server.js'));
          await lstat(resolve(root, '.next/static'));
          const webBuildSha256 = await treeDigest(root);
          const staticAssetsSha256 = await treeDigest(resolve(root, '.next/static'));
          await appendFile(resolve(output), `webBuildSha256=${webBuildSha256}\nstaticAssetsSha256=${staticAssetsSha256}\n`);
          NODE
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

      - name: Attest backend image provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/meetwise-backend
          subject-digest: ${{ steps.images.outputs.backend_digest }}

      - name: Attest Web image provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/meetwise-web
          subject-digest: ${{ steps.images.outputs.web_digest }}

      - name: Verify both GitHub provenance attestations before ECS mutation
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          gh attestation verify "oci://$REGISTRY/$NAMESPACE/meetwise-backend@${{ steps.images.outputs.backend_digest }}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://$REGISTRY/$NAMESPACE/meetwise-web@${{ steps.images.outputs.web_digest }}" --repo "$GITHUB_REPOSITORY"

      - name: Package source tarball
        id: source
        run: |
          git archive --format=tar "${{ steps.git.outputs.commit }}" | gzip -9 > /tmp/source.tar.gz
          echo "source_bytes=$(stat -c %s /tmp/source.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "source_digest=$(sha256sum /tmp/source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Connect ephemeral Tailscale node
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:meetwise-cd

      - name: Configure SSH to ECS (tailnet-only, forced command)
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.ECS_CD_DEPLOY_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Host is a tailnet IP/hostname only (no shell metacharacters); the
          # remote `meetwise-cd` account has NO shell — its authorized_keys
          # force-runs /usr/local/bin/meetwise-cd-receive.
          {
            printf 'Host meetwise-ecs\n'
            printf '  HostName %s\n' "${{ secrets.ECS_CD_SSH_HOST }}"
            printf '  User meetwise-cd\n'
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
            printf '  ConnectTimeout 30\n'
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 4\n'
          } > "$HOME/.ssh/config"
          printf '%s\n' "${{ secrets.ECS_CD_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/config"

      - name: Verify forced-command sentinel before sensitive ECS SSH
        run: |
          set -euo pipefail
          sentinel_status=0
          sentinel_output="$(ssh -o BatchMode=yes -o LogLevel=ERROR meetwise-ecs 'meetwise-cd __meetwise_cd_forced_command_sentinel__' 2>&1)" || sentinel_status=$?
          [[ "$sentinel_status" -ne 0 && "$sentinel_output" == 'meetwise_cd_unknown_command' ]] || {
            echo 'forced-command sentinel did not fail closed with the exact unknown-command reason' >&2
            exit 1
          }

      - name: Verify separately provisioned ECS controller bundle
        id: controller
        run: |
          rows="$(mktemp)"
          while IFS='|' read -r source _destination _mode; do
            test -n "$source" || continue
            printf '%s|%s|%s|%s\n' "$source" "$_destination" "$_mode" "$(sha256sum "$source" | awk '{print $1}')" >> "$rows"
          done < ops/ecs/full-stack/cd-controller-files.txt
          expected="$(sha256sum "$rows" | awk '{print $1}')"
          actual="$(ssh meetwise-ecs 'meetwise-cd controller-version')"
          test "$expected" = "$actual" || { echo 'ECS controller bundle is not provisioned for this release' >&2; exit 1; }
          echo "digest=$expected" >> "$GITHUB_OUTPUT"

      - name: Receive source onto ECS
        id: release
        run: |
          release="${{ steps.git.outputs.commit }}-fullstack-$(date +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          transaction_id="$release"
          recovery_token="$(printf '%s' "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$release" | sha256sum | awk '{print $1}')"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "TRANSACTION_ID=$transaction_id" >> "$GITHUB_ENV"
          echo "RECOVERY_TOKEN=$recovery_token" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "transaction_id=$transaction_id" >> "$GITHUB_OUTPUT"
          echo "recovery_token=$recovery_token" >> "$GITHUB_OUTPUT"
          cat /tmp/source.tar.gz | ssh meetwise-ecs "meetwise-cd receive-source $release ${{ steps.source.outputs.source_digest }}"

      - name: Install dependencies on ECS (pg for prepare/db-verify; no web build)
        run: ssh meetwise-ecs "meetwise-cd install-deps $RELEASE"

      - name: Begin token-bound full-stack transaction
        id: transaction
        env:
          ORIGIN: ${{ secrets.ECS_FULL_STACK_ORIGIN }}
        run: |
          controller_digest='${{ steps.controller.outputs.digest }}'
          compose_digest="$(sha256sum docker/compose.prod.yml | awk '{print $1}')"
          [[ "$controller_digest" =~ ^[a-f0-9]{64}$ && "$compose_digest" =~ ^[a-f0-9]{64}$ ]] || { echo 'transaction controller/compose digest invalid' >&2; exit 1; }
          begin_json="$(ssh meetwise-ecs "meetwise-cd transaction begin $TRANSACTION_ID $RELEASE ${{ steps.git.outputs.commit }} ${{ steps.git.outputs.tree }} $RECOVERY_TOKEN $controller_digest $compose_digest ${{ steps.source.outputs.source_digest }} ${{ steps.images.outputs.backend_digest }} ${{ steps.images.outputs.web_digest }} $ORIGIN")"
          generation="$(printf '%s' "$begin_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const v=JSON.parse(s); if(!Number.isSafeInteger(v.generation)||v.generation<1)process.exit(1); process.stdout.write(String(v.generation))}catch{process.exit(1)}})')" || {
            echo 'transaction begin did not return a root-owned generation' >&2
            exit 1
          }
          echo "GENERATION=$generation" >> "$GITHUB_ENV"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "controller_digest=$controller_digest" >> "$GITHUB_OUTPUT"
          echo "compose_digest=$compose_digest" >> "$GITHUB_OUTPUT"

      # Snapshot the currently enabled release before any compose or publication
      # mutation. Recovery must restore the predecessor's image/env/edge state.
      - name: Snapshot predecessor before compose pull or revoke
        run: ssh meetwise-ecs "meetwise-cd transaction snapshot $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Revalidate unique CI workflow and main before predecessor revoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_sha='${{ steps.git.outputs.commit }}'
          ci_run_id='${{ steps.git.outputs.ci_run_id }}'
          ci_workflow_id='${{ steps.git.outputs.ci_workflow_id }}'
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$ci_sha" || { echo 'stale main before revoke' >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id")"
          test "$(jq -r .id <<<"$run_json")" = "$ci_run_id" || { echo 'CI run id changed before revoke' >&2; exit 1; }
          test "$(jq -r .workflow_id <<<"$run_json")" = "$ci_workflow_id" || { echo 'CI workflow id changed before revoke' >&2; exit 1; }
          test "$(jq -r .head_sha <<<"$run_json")" = "$ci_sha" || { echo 'CI SHA changed before revoke' >&2; exit 1; }
          test "$(jq -r .head_branch <<<"$run_json")" = main || { echo 'CI branch changed before revoke' >&2; exit 1; }
          test "$(jq -r .event <<<"$run_json")" = push || { echo 'CI event changed before revoke' >&2; exit 1; }
          test "$(jq -r .conclusion <<<"$run_json")" = success || { echo 'CI run no longer successful before revoke' >&2; exit 1; }
          workflow_inventory="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          ci_count="$(jq '[.[].workflows[] | select(.name == "ci")] | length' <<<"$workflow_inventory")"
          test "$ci_count" = 1 || { echo 'exactly one workflow named ci is required before revoke' >&2; exit 1; }
          ci_path="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].path' <<<"$workflow_inventory")"
          test "$ci_path" = .github/workflows/ci.yml || { echo 'protected ci path changed before revoke' >&2; exit 1; }
          live_workflow_id="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].id' <<<"$workflow_inventory")"
          test "$live_workflow_id" = "$ci_workflow_id" || { echo 'unique ci workflow changed before revoke' >&2; exit 1; }

      - name: Pull images + pin runtime identity under the transaction lease
        run: |
          ssh meetwise-ecs "meetwise-cd transaction compose-pull $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN ${{ steps.images.outputs.backend_digest }} ${{ steps.images.outputs.web_digest }}"

      - name: Revoke current public release under the transaction lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revoke_status=0
          revoke_json=''
          revoke_json="$(ssh meetwise-ecs "meetwise-cd transaction revoke-predecessor $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN")" || revoke_status=$?
          if [ "$revoke_status" -eq 0 ]; then
            echo 'predecessor was already revoked'
          elif [ "$revoke_status" -eq 75 ]; then
            # The predecessor is generation N while this successor transaction
            # is generation N+1.  Never infer that identity from the public
            # manifest: ask the token-bound root ledger for the identity which
            # revoke-predecessor persisted (the root may still be waiting for
            # Pages to acknowledge the signed revoked receipt).
            revoke_status_json="$(ssh meetwise-ecs "meetwise-cd transaction status $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN")" || {
              echo 'root transaction status unavailable while predecessor revoke is pending' >&2
              exit 1
            }
            revoked_identity="$(printf '%s' "$revoke_status_json" | node --input-type=module -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { try { const ledger = JSON.parse(s); const identity = ledger?.candidate?.predecessorRevoked; if (identity?.identityBound !== true || typeof identity.freshHost !== "boolean" || !Number.isSafeInteger(identity.generation) || identity.generation < 1 || !/^[a-f0-9]{64}$/.test(identity.fingerprint ?? "")) process.exit(1); process.stdout.write(JSON.stringify({ generation: identity.generation, fingerprint: identity.fingerprint })); } catch { process.exit(1); } })')" || {
              echo 'root transaction status did not return a trusted predecessor identity' >&2
              exit 1
            }
            revoked_generation="$(jq -r .generation <<<"$revoked_identity")"
            revoked_fingerprint="$(jq -r .fingerprint <<<"$revoked_identity")"
            [[ "$revoked_generation" =~ ^[1-9][0-9]*$ && "$revoked_fingerprint" =~ ^[a-f0-9]{64}$ ]] || { echo 'revoked manifest identity invalid' >&2; exit 1; }
            (( revoked_generation < GENERATION )) || { echo 'predecessor generation is not older than candidate transaction' >&2; exit 1; }
            gh workflow run pages-preview.yml --ref main \
              -f expected_state=disabled \
              -f expected_generation="$revoked_generation" \
              -f expected_manifest_sha256="$revoked_fingerprint"
            revoked=0
            for _ in $(seq 1 260); do
              retry_status=0
              ssh meetwise-ecs "meetwise-cd transaction revoke-predecessor $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN" || retry_status=$?
              if [ "$retry_status" -eq 0 ]; then
                revoked=1
                break
              fi
              test "$retry_status" -eq 75 || { echo "revoke failed with non-retryable status $retry_status" >&2; exit "$retry_status"; }
              sleep 15
            done
            test "$revoked" = 1 || { echo 'revoke did not reach the exact Pages disabled receipt' >&2; exit 1; }
          else
            echo "revoke failed before Pages dispatch with status $revoke_status" >&2
            exit "$revoke_status"
          fi

      - name: Close the edge after predecessor revoke
        run: ssh meetwise-ecs "meetwise-cd transaction close-edge $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Quiesce all writers before migration
        run: ssh meetwise-ecs "meetwise-cd transaction quiesce $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Run database migrations under the transaction lease
        run: ssh meetwise-ecs "meetwise-cd transaction migrate $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Prepare deterministic approval + target from the migrated ledger
        id: prepare
        env:
          ORIGIN: ${{ secrets.ECS_FULL_STACK_ORIGIN }}
        run: |
          prepare_json="$(ssh meetwise-ecs "meetwise-cd prepare ${{ steps.git.outputs.commit }} ${{ steps.git.outputs.tree }} $ORIGIN ${{ steps.web.outputs.webBuildSha256 }} ${{ steps.web.outputs.staticAssetsSha256 }} ${{ steps.images.outputs.backend_digest }} ${{ steps.images.outputs.web_digest }} $RELEASE")"
          prepared_generation="$(printf '%s' "$prepare_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const v=JSON.parse(s); if(!Number.isSafeInteger(v.generation))process.exit(1); process.stdout.write(String(v.generation))})')"
          test "$prepared_generation" = "$GENERATION" || { echo 'prepare generation differs from transaction identity' >&2; exit 1; }
          echo "generation=$prepared_generation" >> "$GITHUB_OUTPUT"

      - name: Start backend inside the transaction
        run: ssh meetwise-ecs "meetwise-cd transaction start-backend $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Start internal Web inside the transaction
        run: ssh meetwise-ecs "meetwise-cd transaction start-web-internal $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Verify deep synthetic data inside the transaction
        run: ssh meetwise-ecs "meetwise-cd transaction verify-data $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Publish the probe manifest inside the transaction
        run: ssh meetwise-ecs "meetwise-cd transaction publish-probe $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Revalidate main and CI identity before public activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "${{ steps.git.outputs.commit }}" || { echo 'stale main before activate' >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ steps.git.outputs.ci_run_id }}")"
          test "$(jq -r .head_sha <<<"$run_json")" = "${{ steps.git.outputs.commit }}" || { echo 'CI SHA changed before activate' >&2; exit 1; }
          test "$(jq -r .conclusion <<<"$run_json")" = success || { echo 'CI run no longer successful before activate' >&2; exit 1; }

      - name: Activate public probe window
        run: ssh meetwise-ecs "meetwise-cd transaction activate $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"

      - name: Export one-time probe identity
        id: probe
        env:
          ORIGIN: ${{ secrets.ECS_FULL_STACK_ORIGIN }}
        run: |
          set -euo pipefail
          nonce="$(ssh meetwise-ecs "meetwise-cd probe-nonce")"
          manifest_text="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 "$ORIGIN/preview-release-manifest.json")" || {
            echo 'candidate probe manifest unavailable' >&2
            exit 1
          }
          manifest_file="$(mktemp)"
          trap 'rm -f "$manifest_file"' EXIT
          printf '%s' "$manifest_text" > "$manifest_file"
          # Keep manifest hashing in this fixed workflow script. Loading the
          # candidate checkout's ops/ecs module after credentials are present
          # would make the credentialed runner execute candidate JavaScript.
          manifest_sha256="$(node --input-type=module - "$manifest_file" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const [manifestPath] = process.argv.slice(2);
          const canonicalJson = (value) => {
            if (Array.isArray(value)) return `[${value.map(canonicalJson).join(',')}]`;
            if (value && typeof value === 'object') return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(',')}}`;
            return JSON.stringify(value);
          };
          const value = JSON.parse(readFileSync(manifestPath, 'utf8'));
          process.stdout.write(createHash('sha256').update(canonicalJson(value)).digest('hex'));
          NODE
          )" || {
            echo 'candidate probe manifest identity invalid' >&2
            exit 1
          }
          [[ "$manifest_sha256" =~ ^[a-f0-9]{64}$ ]] || { echo 'candidate probe manifest digest invalid' >&2; exit 1; }
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "probe_nonce=$nonce" >> "$GITHUB_OUTPUT"
          echo "expected_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Token-bound recovery after deploy-stage failure
        if: ${{ always() && failure() && steps.transaction.outputs.generation != '' }}
        env:
          TRANSACTION_ID: ${{ steps.release.outputs.transaction_id }}
          RELEASE: ${{ steps.release.outputs.release }}
          RECOVERY_TOKEN: ${{ steps.release.outputs.recovery_token }}
        run: |
          ssh meetwise-ecs "meetwise-cd transaction recover $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN" || {
            echo 'token-bound recovery request failed; leave edge closed and escalate' >&2
            exit 1
          }

  # The signing key belongs to this fixed, independent verifier workflow. The
  # candidate checkout never receives it and therefore cannot self-attest.
  # This is an ordinary job (rather than a cross-repository reusable workflow):
  # GitHub does not pass the called repository's protected environment secrets
  # through workflow_call. A narrowly scoped preview-cd token dispatches the
  # verifier, which runs with its own protected signing environment and returns
  # one nonce-named artifact. If this exact target/commit is unavailable, the
  # dependency fails and the release remains unconfirmed/closed.
  external-verify:
    needs: deploy-probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-cd
    permissions:
      contents: read
      actions: read
    outputs:
      receipt_b64: ${{ steps.verify.outputs.receipt_b64 }}
    env:
      CONTROL_REPOSITORY: miaole/meetwise-deploy-control
      CONTROL_WORKFLOW: verify.yml
      CONTROL_REF: main
      # Replace this marker with the final immutable commit after the v2
      # verifier control-repo change is merged. Until then dispatch must fail
      # closed rather than silently using the old v1 receipt contract.
      CONTROL_COMMIT: 28939a6f5ccb571be5bfdb72f0d74967ac1b9b66
    steps:
      - name: Mint a repository-scoped verifier installation token
        id: verifier-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.VERIFIER_DISPATCH_APP_ID }}
          private-key: ${{ secrets.VERIFIER_DISPATCH_APP_PRIVATE_KEY }}
          owner: miaole
          repositories: meetwise-deploy-control
          permission-actions: write
          permission-metadata: read

      - name: Dispatch the independent verifier at the exact control commit
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.verifier-token.outputs.token }}
          ORIGIN: ${{ needs.deploy-probe.outputs.origin }}
          PROBE_NONCE: ${{ needs.deploy-probe.outputs.probe_nonce }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.deploy-probe.outputs.expected_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'verifier dispatch credential missing' >&2; exit 1; }
          [[ "$CONTROL_REPOSITORY" == 'miaole/meetwise-deploy-control' ]] || { echo 'verifier repository is not fixed' >&2; exit 1; }
          [[ "$CONTROL_WORKFLOW" == 'verify.yml' ]] || { echo 'verifier workflow is not fixed' >&2; exit 1; }
          [[ "$CONTROL_REF" == 'main' ]] || { echo 'verifier ref is not fixed to protected main' >&2; exit 1; }
          [[ "$CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo 'verifier control commit is invalid' >&2; exit 1; }
          [[ "$ORIGIN" =~ ^https://[a-z0-9-]+\.tail[a-z0-9]+\.ts\.net$ ]] || { echo 'verifier origin is invalid' >&2; exit 1; }
          [[ "$PROBE_NONCE" =~ ^[a-f0-9]{64}$ ]] || { echo 'verifier nonce is invalid' >&2; exit 1; }
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'verifier manifest identity is invalid' >&2; exit 1; }
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -cn --arg ref "$CONTROL_REF" --arg origin "$ORIGIN" --arg nonce "$PROBE_NONCE" --arg manifest "$EXPECTED_MANIFEST_SHA256" '{ref:$ref,inputs:{origin:$origin,probe_nonce:$nonce,expected_manifest_sha256:$manifest}}')"
          printf '%s' "$payload" | gh api --method POST \
            --header 'Accept: application/vnd.github+json' \
            --input - "repos/$CONTROL_REPOSITORY/actions/workflows/$CONTROL_WORKFLOW/dispatches" >/dev/null
          printf 'dispatch_started=%s\n' "$dispatch_started" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact verifier run
        id: run
        env:
          GH_TOKEN: ${{ steps.verifier-token.outputs.token }}
          DISPATCH_STARTED: ${{ steps.dispatch.outputs.dispatch_started }}
          EXPECTED_RUN_NAME: meetwise-public-origin-${{ needs.deploy-probe.outputs.probe_nonce }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 120); do
            runs="$(gh api --paginate --slurp "repos/$CONTROL_REPOSITORY/actions/workflows/$CONTROL_WORKFLOW/runs?event=workflow_dispatch&per_page=100")" || {
              echo 'verifier run inventory unavailable' >&2
              exit 1
            }
            run_id="$(jq -r --arg start "$DISPATCH_STARTED" --arg sha "$CONTROL_COMMIT" --arg title "$EXPECTED_RUN_NAME" '
              [.[].workflow_runs[]
                | select(.event == "workflow_dispatch" and .head_sha == $sha and .created_at >= $start and .display_title == $title)]
              | sort_by(.created_at, .id)
              | if length == 1 then .[0].id else empty end
            ' <<<"$runs")"
            if [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then break; fi
            sleep 5
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo 'exact verifier run was not found' >&2; exit 1; }

          workflow_json="$(gh api "repos/$CONTROL_REPOSITORY/actions/workflows/$CONTROL_WORKFLOW")" || {
            echo 'verifier workflow identity unavailable' >&2
            exit 1
          }
          workflow_id="$(jq -r '.id // empty' <<<"$workflow_json")"
          workflow_path="$(jq -r '.path // empty' <<<"$workflow_json")"
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ && "$workflow_path" == '.github/workflows/verify.yml' ]] || {
            echo 'verifier workflow identity mismatch' >&2
            exit 1
          }

          run_json="$(gh api "repos/$CONTROL_REPOSITORY/actions/runs/$run_id")" || {
            echo 'verifier run identity unavailable' >&2
            exit 1
          }
          jq -e --argjson id "$run_id" --arg workflow_id "$workflow_id" \
            --arg sha "$CONTROL_COMMIT" --arg start "$DISPATCH_STARTED" --arg title "$EXPECTED_RUN_NAME" \
            '(.id == $id)
             and (.workflow_id == ($workflow_id | tonumber))
             and (.repository.full_name == "miaole/meetwise-deploy-control")
             and (.path == ".github/workflows/verify.yml")
             and (.event == "workflow_dispatch")
             and (.head_sha == $sha)
             and (.head_branch == "main")
             and (.created_at >= $start)
             and (.display_title == $title)' <<<"$run_json" >/dev/null || {
            echo 'verifier run identity mismatch' >&2
            exit 1
          }
          status="$(jq -r '.status // empty' <<<"$run_json")"
          completed=0
          for _ in $(seq 1 120); do
            [[ "$status" == completed ]] && { completed=1; break; }
            sleep 5
            run_json="$(gh api "repos/$CONTROL_REPOSITORY/actions/runs/$run_id")" || {
              echo 'verifier run status unavailable' >&2
              exit 1
            }
            jq -e --argjson id "$run_id" --arg workflow_id "$workflow_id" \
              --arg sha "$CONTROL_COMMIT" --arg title "$EXPECTED_RUN_NAME" \
              '(.id == $id) and (.workflow_id == ($workflow_id | tonumber)) and
               (.repository.full_name == "miaole/meetwise-deploy-control") and
               (.path == ".github/workflows/verify.yml") and (.event == "workflow_dispatch") and
               (.head_sha == $sha) and (.display_title == $title)' <<<"$run_json" >/dev/null || {
              echo 'verifier run identity changed while waiting' >&2
              exit 1
            }
            status="$(jq -r '.status // empty' <<<"$run_json")"
          done
          [[ "$completed" == 1 ]] || { echo 'independent verifier timed out' >&2; exit 1; }
          [[ "$(jq -r '.conclusion // empty' <<<"$run_json")" == success ]] || {
            echo 'independent verifier did not succeed' >&2
            exit 1
          }
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download and validate the nonce-bound signed receipt
        id: verify
        env:
          GH_TOKEN: ${{ steps.verifier-token.outputs.token }}
          ORIGIN: ${{ needs.deploy-probe.outputs.origin }}
          PROBE_NONCE: ${{ needs.deploy-probe.outputs.probe_nonce }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.deploy-probe.outputs.expected_manifest_sha256 }}
          VERIFIER_RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIER_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'verifier run id is invalid' >&2; exit 1; }
          [[ "$PROBE_NONCE" =~ ^[a-f0-9]{64}$ ]] || { echo 'verifier nonce is invalid' >&2; exit 1; }
          artifact_name="meetwise-public-origin-receipt-$PROBE_NONCE"
          artifacts="$(gh api "repos/$CONTROL_REPOSITORY/actions/runs/$VERIFIER_RUN_ID/artifacts?per_page=100")" || {
            echo 'verifier artifact inventory unavailable' >&2
            exit 1
          }
          artifact_count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts")"
          [[ "$artifact_count" == 1 ]] || { echo 'exactly one nonce-bound verifier artifact is required' >&2; exit 1; }
          artifact_size="$(jq --arg name "$artifact_name" -r '[.artifacts[] | select(.name == $name and .expired == false)][0].size_in_bytes // 0' <<<"$artifacts")"
          [[ "$artifact_size" =~ ^[1-9][0-9]*$ && "$artifact_size" -le 65536 ]] || { echo 'verifier artifact size is invalid' >&2; exit 1; }

          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          gh run download "$VERIFIER_RUN_ID" --repo "$CONTROL_REPOSITORY" --name "$artifact_name" --dir "$download_dir" >/dev/null 2>&1 || {
            echo 'verifier receipt artifact download failed' >&2
            exit 1
          }
          mapfile -t receipt_files < <(find "$download_dir" -type f -print)
          expected_receipt_filename='receipt.json'
          [[ "${#receipt_files[@]}" == 1 && "$(basename "${receipt_files[0]}")" == "$expected_receipt_filename" ]] || {
            echo 'verifier artifact must contain exactly receipt.json' >&2
            exit 1
          }
          receipt_path="${receipt_files[0]}"
          receipt_bytes="$(wc -c < "$receipt_path" | tr -d '[:space:]')"
          [[ "$receipt_bytes" =~ ^[1-9][0-9]*$ && "$receipt_bytes" -le 32768 ]] || { echo 'verifier receipt size is invalid' >&2; exit 1; }
          RECEIPT_PATH="$receipt_path" ORIGIN="$ORIGIN" PROBE_NONCE="$PROBE_NONCE" CONTROL_COMMIT="$CONTROL_COMMIT" node <<'NODE'
          // BEGIN caller receipt validator v2
          const { readFileSync } = require('node:fs');
          const RECEIPT_HEX64 = /^[a-f0-9]{64}$/;
          const RECEIPT_ORIGIN = /^https:\/\/[a-z0-9-]+\.tail[a-z0-9]+\.ts\.net$/;
          const RECEIPT_COMMIT = /^[a-f0-9]{40}$/;
          const RECEIPT_RUN_ID = /^[1-9][0-9]*$/;
          const RECEIPT_BASE64 = /^[A-Za-z0-9+/]+={0,2}$/;
          const RECEIPT_HEADER_NAMES = new Set(['content-type', 'cache-control']);
          const RECEIPT_PAGE_PATHS = new Set(['/dashboard', '/interviews', '/jobs', '/resume', '/settings', '/privacy', '/recruiter/jobs', '/recruiter/talent']);
          const RECEIPT_UNPROVEN_REASONS = Object.freeze({
            roleBoundary: 'no safe recruiter-to-candidate negative write-free contract is available',
            api: 'privacy export is intentionally omitted because Playwright API responses may buffer personal data',
            sse: 'no stable persisted interview-or-quiz id is permitted for the short verifier',
            worker: 'no business object is created by the short verifier',
          });
          const receiptFail = (code) => { throw new Error(code); };
          function receiptExactKeys(value, expected, label) {
            if (!value || typeof value !== 'object' || Array.isArray(value)) receiptFail(`${label}_shape_invalid`);
            const actual = Object.keys(value).sort();
            const wanted = [...expected].sort();
            if (JSON.stringify(actual) !== JSON.stringify(wanted)) receiptFail(`${label}_keys_invalid`);
          }
          function receiptDigest(value, label) {
            if (typeof value !== 'string' || !RECEIPT_HEX64.test(value)) receiptFail(`${label}_digest_invalid`);
          }
          function receiptAscii(value, label) {
            if (typeof value !== 'string' || !/^[\x20-\x7e]{1,256}$/.test(value)) receiptFail(`${label}_value_invalid`);
          }
          function receiptHeaderMap(headers, label) {
            receiptExactKeys(headers, Object.keys(headers).filter((key) => RECEIPT_HEADER_NAMES.has(key)), label);
            for (const [name, value] of Object.entries(headers)) {
              if (!RECEIPT_HEADER_NAMES.has(name)) receiptFail(`${label}_name_invalid`);
              receiptAscii(value, `${label}_${name}`);
            }
          }
          function receiptPage(page, label) {
            receiptExactKeys(page, ['path', 'status', 'headers', 'bodyHash', 'bodyStored', 'markerHashes', 'negativeMarkerHashes'], label);
            if (typeof page.path !== 'string' || !RECEIPT_PAGE_PATHS.has(page.path)) receiptFail(`${label}_path_invalid`);
            if (page.status !== 200) receiptFail(`${label}_status_invalid`);
            receiptHeaderMap(page.headers, `${label}_headers`);
            receiptDigest(page.bodyHash, `${label}_body`);
            if (page.bodyStored !== false || !Array.isArray(page.markerHashes) || !Array.isArray(page.negativeMarkerHashes) || page.markerHashes.length === 0) receiptFail(`${label}_semantic_invalid`);
            for (const marker of [...page.markerHashes, ...page.negativeMarkerHashes]) receiptDigest(marker, `${label}_marker`);
          }
          function receiptUnproven(value, label, reasonKey) {
            receiptExactKeys(value, ['status', 'reason'], label);
            if (value.status !== 'unproven' || value.reason !== RECEIPT_UNPROVEN_REASONS[reasonKey] || typeof value.reason !== 'string' || value.reason.length < 1 || value.reason.length > 256 || /[\u0000-\u001f\u007f]/.test(value.reason)) receiptFail(`${label}_invalid`);
          }
          function receiptAccount(account, label, expectedRole, expectedLoginPath) {
            receiptExactKeys(account, ['role', 'accountEmailSha256', 'loginPath', 'sessionCookie', 'pages', 'roleBoundary', 'api', 'sse', 'worker', 'semanticAssertionCount'], label);
            if (account.role !== expectedRole || account.loginPath !== expectedLoginPath) receiptFail(`${label}_identity_invalid`);
            receiptDigest(account.accountEmailSha256, `${label}_account`);
            receiptExactKeys(account.sessionCookie, ['httpOnly', 'secure', 'roleCookie'], `${label}_session`);
            if (account.sessionCookie.httpOnly !== true || account.sessionCookie.secure !== true || account.sessionCookie.roleCookie !== expectedRole) receiptFail(`${label}_session_invalid`);
            if (!Array.isArray(account.pages) || account.pages.length < 1) receiptFail(`${label}_pages_invalid`);
            const paths = new Set();
            account.pages.forEach((page, index) => {
              receiptPage(page, `${label}_page_${index}`);
              if (paths.has(page.path)) receiptFail(`${label}_duplicate_page`);
              paths.add(page.path);
            });
            if (!account.roleBoundary || typeof account.roleBoundary !== 'object' || Array.isArray(account.roleBoundary)) receiptFail(`${label}_role_boundary_shape_invalid`);
            if (account.roleBoundary.status === 'verified') {
              receiptExactKeys(account.roleBoundary, ['status', 'path', 'markerHashes'], `${label}_role_boundary`);
              if (account.roleBoundary.path !== '/recruiter/jobs' || !Array.isArray(account.roleBoundary.markerHashes) || account.roleBoundary.markerHashes.length < 1) receiptFail(`${label}_role_boundary_invalid`);
              account.roleBoundary.markerHashes.forEach((marker) => receiptDigest(marker, `${label}_role_boundary_marker`));
            } else {
              receiptUnproven(account.roleBoundary, `${label}_role_boundary`, 'roleBoundary');
            }
            receiptUnproven(account.api, `${label}_api`, 'api');
            receiptUnproven(account.sse, `${label}_sse`, 'sse');
            receiptUnproven(account.worker, `${label}_worker`, 'worker');
            if (!Number.isInteger(account.semanticAssertionCount) || account.semanticAssertionCount < 1) receiptFail(`${label}_semantic_count_invalid`);
          }
          function validateCallerReceipt(value, { origin, nonce, manifest, controlCommit, runId }) {
            receiptExactKeys(value, ['schemaVersion', 'origin', 'probeNonce', 'checkedAt', 'manifestSha256', 'rootStatus', 'loginStatus', 'manifestStatus', 'rootUrl', 'loginUrl', 'manifestUrl', 'rootSha256', 'blackboxSha256', 'signingKeyId', 'verifier', 'e2e', 'signature'], 'receipt');
            if (value.schemaVersion !== 2 || value.origin !== origin || !RECEIPT_ORIGIN.test(origin) || value.probeNonce !== nonce || !RECEIPT_HEX64.test(nonce) || value.manifestSha256 !== manifest || !RECEIPT_HEX64.test(manifest)) receiptFail('receipt_binding_invalid');
            if (value.checkedAt !== new Date(value.checkedAt).toISOString() || Date.parse(value.checkedAt) > Date.now() + 120000) receiptFail('receipt_time_invalid');
            if (value.rootStatus !== 200 || value.loginStatus !== 200 || value.manifestStatus !== 200) receiptFail('receipt_status_invalid');
            if (value.rootUrl !== `${origin}/` || value.loginUrl !== `${origin}/login` || value.manifestUrl !== `${origin}/preview-release-manifest.json`) receiptFail('receipt_urls_invalid');
            for (const key of ['manifestSha256', 'rootSha256', 'blackboxSha256']) receiptDigest(value[key], `receipt_${key}`);
            if (value.signingKeyId !== 'probe-receipt-ed25519-v2' || typeof value.signature !== 'string' || !RECEIPT_BASE64.test(value.signature) || Buffer.from(value.signature, 'base64').length !== 64) receiptFail('receipt_signature_invalid');
            receiptExactKeys(value.verifier, ['repository', 'workflow', 'ref', 'commit', 'runId', 'sourceSha256', 'workflowSha256', 'packageLockSha256'], 'receipt_verifier');
            if (value.verifier.repository !== 'miaole/meetwise-deploy-control' || value.verifier.workflow !== 'verify-meetwise-public-origin' || value.verifier.ref !== 'refs/heads/main' || value.verifier.commit !== controlCommit || !RECEIPT_COMMIT.test(controlCommit) || value.verifier.runId !== runId || !RECEIPT_RUN_ID.test(runId)) receiptFail('receipt_verifier_identity_invalid');
            for (const key of ['sourceSha256', 'workflowSha256', 'packageLockSha256']) receiptDigest(value.verifier[key], `receipt_verifier_${key}`);
            receiptExactKeys(value.e2e, ['status', 'scope', 'complete', 'noCookieProtectedRedirect', 'accounts', 'sensitiveResponseBodies'], 'receipt_e2e');
            if (value.e2e.status !== 'passed_pages_only' || value.e2e.scope !== 'browser_auth_pages_only' || value.e2e.complete !== false || value.e2e.sensitiveResponseBodies !== 'not_stored') receiptFail('receipt_e2e_status_invalid');
            receiptExactKeys(value.e2e.noCookieProtectedRedirect, ['origin', 'pathname', 'search'], 'receipt_redirect');
            if (value.e2e.noCookieProtectedRedirect.origin !== origin || value.e2e.noCookieProtectedRedirect.pathname !== '/login' || value.e2e.noCookieProtectedRedirect.search !== '?next=%2Fdashboard') receiptFail('receipt_redirect_invalid');
            receiptExactKeys(value.e2e.accounts, ['candidate', 'recruiter'], 'receipt_accounts');
            receiptAccount(value.e2e.accounts.candidate, 'receipt_candidate', 'candidate', '/dashboard');
            receiptAccount(value.e2e.accounts.recruiter, 'receipt_recruiter', 'recruiter', '/recruiter/jobs');
            return value;
          }
          // END caller receipt validator v2
          const path = process.env.RECEIPT_PATH;
          const value = JSON.parse(readFileSync(path, 'utf8'));
          validateCallerReceipt(value, {
            origin: process.env.ORIGIN,
            nonce: process.env.PROBE_NONCE,
            manifest: process.env.EXPECTED_MANIFEST_SHA256,
            controlCommit: process.env.CONTROL_COMMIT,
            runId: process.env.VERIFIER_RUN_ID,
          });
          NODE
          receipt_b64="$(base64 < "$receipt_path" | tr -d '\n')"
          [[ "$receipt_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || { echo 'receipt base64 encoding invalid' >&2; exit 1; }
          printf 'receipt_b64=%s\n' "$receipt_b64" >> "$GITHUB_OUTPUT"

  confirm:
    needs: [deploy-probe, external-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview-cd
    permissions:
      contents: read
      actions: write
    outputs:
      final_fingerprint: ${{ steps.confirm-public.outputs.final_fingerprint }}
      final_generation: ${{ steps.confirm-public.outputs.final_generation }}
      pages_dispatch_attempted: ${{ steps.pages-dispatch.outputs.dispatched }}
      pages_enabled_receipt: ${{ steps.pages-enabled.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.deploy-probe.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:meetwise-cd
      - name: Configure pinned SSH identity
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.ECS_CD_DEPLOY_KEY }}" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.ECS_CD_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host meetwise-ecs
            HostName ${{ secrets.ECS_CD_SSH_HOST }}
            User meetwise-cd
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Verify forced-command sentinel before sensitive ECS SSH
        run: |
          set -euo pipefail
          sentinel_status=0
          sentinel_output="$(ssh -o BatchMode=yes -o LogLevel=ERROR meetwise-ecs 'meetwise-cd __meetwise_cd_forced_command_sentinel__' 2>&1)" || sentinel_status=$?
          [[ "$sentinel_status" -ne 0 && "$sentinel_output" == 'meetwise_cd_unknown_command' ]] || {
            echo 'forced-command sentinel did not fail closed with the exact unknown-command reason' >&2
            exit 1
          }
      - name: Revalidate main and CI identity before confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_sha='${{ needs.deploy-probe.outputs.commit }}'
          ci_run_id='${{ github.event.workflow_run.id }}'
          ci_workflow_id='${{ github.event.workflow_run.workflow_id }}'
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$ci_sha" || { echo 'stale main before confirm' >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id")"
          test "$(jq -r .id <<<"$run_json")" = "$ci_run_id" || { echo 'CI run id changed before confirm' >&2; exit 1; }
          test "$(jq -r .workflow_id <<<"$run_json")" = "$ci_workflow_id" || { echo 'CI workflow id changed before confirm' >&2; exit 1; }
          test "$(jq -r .head_sha <<<"$run_json")" = "$ci_sha" || { echo 'CI SHA changed before confirm' >&2; exit 1; }
          test "$(jq -r .head_branch <<<"$run_json")" = main || { echo 'CI branch changed before confirm' >&2; exit 1; }
          test "$(jq -r .event <<<"$run_json")" = push || { echo 'CI event changed before confirm' >&2; exit 1; }
          test "$(jq -r .conclusion <<<"$run_json")" = success || { echo 'CI run no longer successful before confirm' >&2; exit 1; }
          workflow_inventory="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          ci_count="$(jq '[.[].workflows[] | select(.name == "ci")] | length' <<<"$workflow_inventory")"
          test "$ci_count" = 1 || { echo 'exactly one workflow named ci is required before confirm' >&2; exit 1; }
          ci_path="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].path' <<<"$workflow_inventory")"
          test "$ci_path" = .github/workflows/ci.yml || { echo 'protected ci path changed before confirm' >&2; exit 1; }
          live_workflow_id="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].id' <<<"$workflow_inventory")"
          test "$live_workflow_id" = "$ci_workflow_id" || { echo 'unique ci workflow changed before confirm' >&2; exit 1; }

      - name: Confirm independently signed short-probe receipt
        id: confirm-public
        env:
          RECEIPT_B64: ${{ needs.external-verify.outputs.receipt_b64 }}
          ORIGIN: ${{ needs.deploy-probe.outputs.origin }}
          TRANSACTION_ID: ${{ needs.deploy-probe.outputs.transaction_id }}
          RELEASE: ${{ needs.deploy-probe.outputs.release }}
          RECOVERY_TOKEN: ${{ needs.deploy-probe.outputs.recovery_token }}
        run: |
          confirm_json="$(printf '%s' "$RECEIPT_B64" | base64 -d | ssh meetwise-ecs "meetwise-cd transaction confirm $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN")"
          final_fingerprint="$(printf '%s' "$confirm_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const v=JSON.parse(s);const f=v?.candidate?.finalManifestFingerprint;if(!/^[a-f0-9]{64}$/.test(f??""))process.exit(1);process.stdout.write(f)}catch{process.exit(1)}})')"
          [[ "$final_fingerprint" =~ ^[a-f0-9]{64}$ ]] || { echo 'transaction confirm did not return a manifest fingerprint' >&2; exit 1; }
          final_generation=''
          manifest_file="$(mktemp)"
          trap 'rm -f "$manifest_file"' EXIT
          for _ in $(seq 1 30); do
            if manifest_text="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 "$ORIGIN/preview-release-manifest.json")"; then
              printf '%s' "$manifest_text" > "$manifest_file"
              final_generation="$(node --input-type=module - "$manifest_file" "$final_fingerprint" "$ORIGIN" <<'NODE'
              import { createHash } from 'node:crypto';
              import { readFileSync } from 'node:fs';
              const [manifestPath, expectedFingerprint, expectedOrigin] = process.argv.slice(2);
              const canonicalJson = (value) => {
                if (Array.isArray(value)) return `[${value.map(canonicalJson).join(',')}]`;
                if (value && typeof value === 'object') return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(',')}}`;
                return JSON.stringify(value);
              };
              const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
              if (!Number.isSafeInteger(manifest.generation) || manifest.status !== 'verified' || manifest.revoked !== false || manifest.origin !== expectedOrigin || createHash('sha256').update(canonicalJson(manifest)).digest('hex') !== expectedFingerprint) process.exit(1);
              process.stdout.write(String(manifest.generation));
              NODE
              || true)"
              [ -n "$final_generation" ] && break
            fi
            sleep 2
          done
          [[ "$final_generation" =~ ^[1-9][0-9]*$ ]] || { echo 'final manifest has no verified generation' >&2; exit 1; }
          echo "final_fingerprint=$final_fingerprint" >> "$GITHUB_OUTPUT"
          echo "final_generation=$final_generation" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages exactly once for the final identity
        id: pages-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FINGERPRINT: ${{ steps.confirm-public.outputs.final_fingerprint }}
          EXPECTED_GENERATION: ${{ steps.confirm-public.outputs.final_generation }}
        run: |
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatch_started=$dispatch_started" >> "$GITHUB_OUTPUT"
          gh workflow run pages-preview.yml --ref main \
            -f expected_state=enabled \
            -f expected_generation="$EXPECTED_GENERATION" \
            -f expected_manifest_sha256="$EXPECTED_FINGERPRINT"
          echo 'dispatched=true' >> "$GITHUB_OUTPUT"

      - name: Wait for the dispatched Pages workflow and exact public receipt
        id: pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_STARTED: ${{ steps.pages-dispatch.outputs.dispatch_started }}
          EXPECTED_FINGERPRINT: ${{ steps.confirm-public.outputs.final_fingerprint }}
          EXPECTED_GENERATION: ${{ steps.confirm-public.outputs.final_generation }}
          ORIGIN: ${{ needs.deploy-probe.outputs.origin }}
        run: |
          pages_run_id=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages-preview.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            pages_run_id="$(jq -r --arg start "$DISPATCH_STARTED" --arg sha "${{ needs.deploy-probe.outputs.commit }}" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .head_sha == $sha and .created_at >= $start)] | sort_by(.created_at) | last.id // empty' <<<"$runs")"
            [ -n "$pages_run_id" ] && break
            sleep 5
          done
          [ -n "$pages_run_id" ] || { echo 'the single Pages dispatch did not create an identifiable run' >&2; exit 1; }
          for _ in $(seq 1 180); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pages_run_id")"
            status="$(jq -r .status <<<"$run_json")"
            if [ "$status" = completed ]; then
              test "$(jq -r .conclusion <<<"$run_json")" = success || { echo 'Pages workflow failed' >&2; exit 1; }
              break
            fi
            sleep 5
          done
          test "$(jq -r .status <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pages_run_id")")" = completed || { echo 'Pages workflow did not complete before timeout' >&2; exit 1; }
          page_url='https://miaole.github.io/meetwise'
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 "$page_url/preview-link-state.json?generation=$EXPECTED_GENERATION&manifest=$EXPECTED_FINGERPRINT" -o /tmp/final-pages-link-state.json; then
            if node --input-type=module - <<'NODE'
            import { readFile } from 'node:fs/promises';
            const state = JSON.parse(await readFile('/tmp/final-pages-link-state.json', 'utf8'));
            if (state.state !== 'enabled' || String(state.generation) !== process.env.EXPECTED_GENERATION || state.manifestSha256 !== process.env.EXPECTED_FINGERPRINT || state.finalFingerprint !== process.env.EXPECTED_FINGERPRINT) process.exit(1);
          NODE
            then
              echo 'final Pages enabled receipt confirmed'
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            fi
            sleep 5
          done
          echo 'final Pages enabled receipt did not arrive' >&2
          exit 1

      # A Pages deployment may have become enabled before a later ECS ledger or
      # CI freshness check failed. Revoke that exact public artifact before
      # asking the root controller to recover; if this bounded receipt cannot
      # be obtained, the job remains red and retryable and commit is impossible.
      - name: Recover Pages to an exact disabled receipt after post-confirm failure
        # confirm-public durably records the final identity in the root ledger
        # before dispatch.  Do not depend on the post-dispatch output: a runner
        # can die after GitHub accepted the dispatch but before that output.
        if: ${{ always() && failure() && steps.confirm-public.outputs.final_fingerprint != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FINGERPRINT: ${{ steps.confirm-public.outputs.final_fingerprint }}
          EXPECTED_GENERATION: ${{ steps.confirm-public.outputs.final_generation }}
        run: |
          disabled_dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pages-preview.yml --ref main \
            -f expected_state=disabled \
            -f expected_generation="$EXPECTED_GENERATION" \
            -f expected_manifest_sha256="$EXPECTED_FINGERPRINT"
          pages_run_id=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages-preview.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            pages_run_id="$(jq -r --arg start "$disabled_dispatch_started" --arg sha "${{ needs.deploy-probe.outputs.commit }}" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .head_sha == $sha and .created_at >= $start)] | sort_by(.created_at) | last.id // empty' <<<"$runs")"
            [ -n "$pages_run_id" ] && break
            sleep 5
          done
          [ -n "$pages_run_id" ] || { echo 'disabled Pages dispatch did not create an identifiable run' >&2; exit 1; }
          for _ in $(seq 1 180); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pages_run_id")"
            if [ "$(jq -r .status <<<"$run_json")" = completed ]; then
              test "$(jq -r .conclusion <<<"$run_json")" = success || { echo 'disabled Pages recovery workflow failed' >&2; exit 1; }
              break
            fi
            sleep 5
          done
          test "$(jq -r .status <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pages_run_id")")" = completed || { echo 'disabled Pages recovery workflow timed out' >&2; exit 1; }
          page_url='https://miaole.github.io/meetwise'
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 "$page_url/preview-link-state.json?generation=$EXPECTED_GENERATION&manifest=$EXPECTED_FINGERPRINT" -o /tmp/final-pages-disabled-state.json; then
              if node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const state = JSON.parse(await readFile('/tmp/final-pages-disabled-state.json', 'utf8'));
          if (state.state !== 'disabled' || String(state.generation) !== process.env.EXPECTED_GENERATION || state.manifestSha256 !== process.env.EXPECTED_FINGERPRINT || state.finalFingerprint !== process.env.EXPECTED_FINGERPRINT) process.exit(1);
          NODE
              then
                echo 'exact Pages disabled recovery receipt confirmed'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'exact Pages disabled recovery receipt did not arrive; leave workflow failed and retryable' >&2
          exit 1

      - name: Bind the exact Pages receipt to the transaction ledger
        env:
          EXPECTED_FINGERPRINT: ${{ steps.confirm-public.outputs.final_fingerprint }}
          TRANSACTION_ID: ${{ needs.deploy-probe.outputs.transaction_id }}
          RELEASE: ${{ needs.deploy-probe.outputs.release }}
          RECOVERY_TOKEN: ${{ needs.deploy-probe.outputs.recovery_token }}
        run: |
          ssh meetwise-ecs "meetwise-cd transaction wait-pages $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN $EXPECTED_FINGERPRINT"

      - name: Revalidate main and CI identity before commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_sha='${{ needs.deploy-probe.outputs.commit }}'
          ci_run_id='${{ github.event.workflow_run.id }}'
          ci_workflow_id='${{ github.event.workflow_run.workflow_id }}'
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$ci_sha" || { echo 'stale main before commit' >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id")"
          test "$(jq -r .id <<<"$run_json")" = "$ci_run_id" || { echo 'CI run id changed before commit' >&2; exit 1; }
          test "$(jq -r .workflow_id <<<"$run_json")" = "$ci_workflow_id" || { echo 'CI workflow id changed before commit' >&2; exit 1; }
          test "$(jq -r .head_sha <<<"$run_json")" = "$ci_sha" || { echo 'CI SHA changed before commit' >&2; exit 1; }
          test "$(jq -r .head_branch <<<"$run_json")" = main || { echo 'CI branch changed before commit' >&2; exit 1; }
          test "$(jq -r .event <<<"$run_json")" = push || { echo 'CI event changed before commit' >&2; exit 1; }
          test "$(jq -r .conclusion <<<"$run_json")" = success || { echo 'CI run no longer successful before commit' >&2; exit 1; }
          workflow_inventory="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          ci_count="$(jq '[.[].workflows[] | select(.name == "ci")] | length' <<<"$workflow_inventory")"
          test "$ci_count" = 1 || { echo 'exactly one workflow named ci is required before commit' >&2; exit 1; }
          ci_path="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].path' <<<"$workflow_inventory")"
          test "$ci_path" = .github/workflows/ci.yml || { echo 'protected ci path changed before commit' >&2; exit 1; }
          live_workflow_id="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].id' <<<"$workflow_inventory")"
          test "$live_workflow_id" = "$ci_workflow_id" || { echo 'unique ci workflow changed before commit' >&2; exit 1; }

      - name: Commit only after exact Pages receipt
        env:
          EXPECTED_FINGERPRINT: ${{ steps.confirm-public.outputs.final_fingerprint }}
          TRANSACTION_ID: ${{ needs.deploy-probe.outputs.transaction_id }}
          RELEASE: ${{ needs.deploy-probe.outputs.release }}
          RECOVERY_TOKEN: ${{ needs.deploy-probe.outputs.recovery_token }}
        run: |
          ssh meetwise-ecs "meetwise-cd verify-public"
          ssh meetwise-ecs "meetwise-cd transaction commit $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN $EXPECTED_FINGERPRINT"

      - name: Token-bound recovery after confirmation or Pages failure
        if: ${{ always() && failure() }}
        env:
          TRANSACTION_ID: ${{ needs.deploy-probe.outputs.transaction_id }}
          RELEASE: ${{ needs.deploy-probe.outputs.release }}
          RECOVERY_TOKEN: ${{ needs.deploy-probe.outputs.recovery_token }}
        run: |
          ssh meetwise-ecs "meetwise-cd transaction recover $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN" || {
            echo 'token-bound recovery request failed; leave edge closed and escalate' >&2
            exit 1
          }

  recover:
    if: >-
      always() && needs.deploy-probe.outputs.generation != '' &&
      (needs.deploy-probe.result != 'success' || needs.external-verify.result != 'success' || needs.confirm.result != 'success')
    needs: [deploy-probe, external-verify, confirm]
    runs-on: ubuntu-latest
    # The recovery step has one shared 13-minute wall-clock budget; keeping the
    # job ceiling at 20 minutes leaves bounded room for Tailscale/SSH setup.
    timeout-minutes: 20
    environment: preview-cd-recovery
    permissions:
      contents: read
      actions: write
    steps:
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:meetwise-cd
      - name: Configure pinned SSH identity for recovery
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.ECS_CD_DEPLOY_KEY }}" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.ECS_CD_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host meetwise-ecs
            HostName ${{ secrets.ECS_CD_SSH_HOST }}
            User meetwise-cd
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Verify forced-command sentinel before sensitive ECS SSH
        run: |
          set -euo pipefail
          sentinel_status=0
          sentinel_output="$(ssh -o BatchMode=yes -o LogLevel=ERROR meetwise-ecs 'meetwise-cd __meetwise_cd_forced_command_sentinel__' 2>&1)" || sentinel_status=$?
          [[ "$sentinel_status" -ne 0 && "$sentinel_output" == 'meetwise_cd_unknown_command' ]] || {
            echo 'forced-command sentinel did not fail closed with the exact unknown-command reason' >&2
            exit 1
          }
      - name: Invoke token-bound recovery and require a receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_BUDGET_SECONDS: '780'
          TRANSACTION_ID: ${{ needs.deploy-probe.outputs.transaction_id }}
          RELEASE: ${{ needs.deploy-probe.outputs.release }}
          RECOVERY_TOKEN: ${{ needs.deploy-probe.outputs.recovery_token }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          deadline=$((started_at + RECOVERY_BUDGET_SECONDS))
          remaining_until() {
            local until="$1" now left
            now="$(date +%s)"
            left=$((until - now))
            (( left > 0 )) || return 124
            printf '%s\n' "$left"
          }
          bounded() {
            local left
            left="$(remaining_until "$deadline")" || return 124
            timeout --signal=TERM --kill-after=5s "${left}s" "$@"
          }
          status_json="$(bounded ssh meetwise-ecs "meetwise-cd transaction status $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN")"
          predecessor_pages="$(printf '%s' "$status_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const p=JSON.parse(s)?.predecessor?.pages;if(!p||!["enabled","disabled","none"].includes(p.state))process.exit(2);if(p.state!=="none"&&(!Number.isSafeInteger(p.generation)||p.generation<1||!/^[a-f0-9]{64}$/.test(p.fingerprint??"")))process.exit(2);process.stdout.write(`${p.state}\t${p.generation??0}\t${p.fingerprint??""}`)}catch{process.exit(2)}})')" || { echo 'predecessor Pages identity missing from durable ledger' >&2; exit 1; }
          pages_identity="$(printf '%s' "$status_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const v=JSON.parse(s);const f=v?.candidate?.finalManifestFingerprint;if(!/^[a-f0-9]{64}$/.test(f??"")||!Number.isSafeInteger(v.generation)||v.generation<1)process.exit(2);process.stdout.write(`${v.generation} ${f}`)}catch{process.exit(2)}})')" || pages_identity=''
          if [ -n "$pages_identity" ]; then
            read -r final_generation final_fingerprint <<<"$pages_identity"
            bounded gh workflow run pages-preview.yml --ref main \
              -f expected_state=disabled \
              -f expected_generation="$final_generation" \
              -f expected_manifest_sha256="$final_fingerprint"
            disabled=0
            for _ in $(seq 1 120); do
              if state="$(bounded curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 10 "https://miaole.github.io/meetwise/preview-link-state.json?generation=$final_generation&manifest=$final_fingerprint")" \
                && env STATE="$state" GEN="$final_generation" FP="$final_fingerprint" node -e 'const v=JSON.parse(process.env.STATE);if(v.state!=="disabled"||String(v.generation)!==process.env.GEN||v.manifestSha256!==process.env.FP||v.finalFingerprint!==process.env.FP)process.exit(1)'; then disabled=1; break; fi
              bounded sleep 5
            done
            test "$disabled" = 1 || { echo 'exact Pages disabled recovery receipt missing' >&2; exit 1; }
          fi
          bounded ssh meetwise-ecs "meetwise-cd transaction recover $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN"
          terminal_json="$(bounded ssh meetwise-ecs "meetwise-cd transaction status $TRANSACTION_ID $RELEASE $RECOVERY_TOKEN")"
          terminal_phase="$(printf '%s' "$terminal_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const p=JSON.parse(s).phase;if(!["rolled_back","forward_only_maintenance"].includes(p))process.exit(2);process.stdout.write(p)})')" || { echo 'release recovery did not reach a terminal phase' >&2; exit 1; }
          IFS=$'\t' read -r predecessor_state predecessor_generation predecessor_fingerprint <<<"$predecessor_pages"
          if [ "$terminal_phase" = rolled_back ] && [ "$predecessor_state" != none ]; then
            bounded gh workflow run pages-preview.yml --ref main \
              -f expected_state="$predecessor_state" \
              -f expected_generation="$predecessor_generation" \
              -f expected_manifest_sha256="$predecessor_fingerprint"
            restored=0
            for _ in $(seq 1 120); do
              if state="$(bounded curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 10 "https://miaole.github.io/meetwise/preview-link-state.json?generation=$predecessor_generation&manifest=$predecessor_fingerprint")" \
                && env STATE="$state" EXPECTED_STATE="$predecessor_state" GEN="$predecessor_generation" FP="$predecessor_fingerprint" node -e 'const v=JSON.parse(process.env.STATE);if(v.state!==process.env.EXPECTED_STATE||String(v.generation)!==process.env.GEN||v.manifestSha256!==process.env.FP||v.finalFingerprint!==process.env.FP)process.exit(1)'; then restored=1; break; fi
              bounded sleep 5
            done
            test "$restored" = 1 || { echo 'exact predecessor Pages recovery receipt missing' >&2; exit 1; }
          fi
