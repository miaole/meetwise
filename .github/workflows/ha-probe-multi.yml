# HA D2 CI probe:multi — CI-safe stub dual+fault + honesty --require-evidence EXIT=1
# Ban: secrets / .env* · claim 阶 D green · claim production HA · flip releaseEvidence
# Ban: wash --require-evidence EXIT=1 into green · claim CI stub green = 阶 D
# Pins: haStatus=NOT_HA · releaseEvidence=false · claimProductionHA=false
# Live GHA artifact URL is recorded after a real Actions run (pattern below); Ban inventing URL.
name: ha-probe-multi

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/ha-probe-multi.yml'
      - 'scripts/ha/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  probe-multi-stub-honesty:
    name: stub probe + honesty EXIT=1 + artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        # packageManager from package.json (pnpm@10.18.0)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps (no secrets / no .env*)
        run: pnpm install --frozen-lockfile

      - name: Pin honesty (NOT_HA · ≠ 阶 D · ≠ production HA)
        run: |
          echo "haStatus=NOT_HA"
          echo "releaseEvidence=false"
          echo "claimProductionHA=false"
          echo "CI stub green ≠ 阶 D green ≠ production HA"
          echo "Local D1 done ≠ 阶 D green"
          echo "Ban wash --require-evidence EXIT=1 into green"
          echo "Ban claim workflow land alone = 阶 D green"

      - name: Prepare CI probe artifact dir
        run: |
          mkdir -p .tmp/ha-ci-probe-artifact
          mkdir -p .tmp/ha-evidence

      # CI-safe stub path (node dual /livez stub + stub fault-inject).
      # No docker dual Nest · no secrets · no .env* · still NOT_HA.
      - name: Stub probe (bring-up-stub + fault-inject) — expect EXIT 0
        id: stub_probe
        run: |
          set -o pipefail
          pnpm ha:probe:multi -- --with-bring-up-stub --with-fault-inject \
            2> >(tee .tmp/ha-ci-probe-artifact/stub-probe.stderr.txt >&2) \
            | tee .tmp/ha-ci-probe-artifact/stub-probe.receipt.txt
          echo "stub probe EXIT=0 — CI-safe stub only; still NOT_HA; ≠ 阶 D; ≠ production HA"

      # Honesty fail-closed: --require-evidence MUST exit 1.
      # EXIT=1 = honesty SUCCESS for this job. Ban flipping to pass / washing into green.
      - name: Honesty --require-evidence — assert EXIT=1 (fail-closed SUCCESS)
        id: honesty
        run: |
          set +e
          pnpm ha:probe:multi -- --require-evidence \
            > .tmp/ha-ci-probe-artifact/require-evidence.receipt.txt \
            2> .tmp/ha-ci-probe-artifact/require-evidence.stderr.txt
          ec=$?
          set -e
          echo "require-evidence exit code: $ec" | tee .tmp/ha-ci-probe-artifact/require-evidence.exit.txt
          if [ "$ec" -eq 1 ]; then
            echo "EXIT=1 = honesty fail-closed SUCCESS — Ban wash to pass"
            echo "haStatus=NOT_HA · releaseEvidence=false · claimProductionHA=false"
            exit 0
          fi
          echo "::error::expected --require-evidence EXIT=1 (honesty), got EXIT=$ec — Ban invent green"
          exit 1

      - name: Write CI probe summary JSON (NOT_HA pins)
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".tmp/ha-ci-probe-artifact";
            const summary = {
              knife: "ha-d2-ci-probe-multi-workflow",
              haStatus: "NOT_HA",
              releaseEvidence: false,
              claimProductionHA: false,
              ladderCD: "STILL_NOT_GREEN",
              ciStubEqualsLadderD: false,
              productionHA: false,
              stubProbe: { cmd: "pnpm ha:probe:multi -- --with-bring-up-stub --with-fault-inject", expectExit: 0 },
              requireEvidence: {
                cmd: "pnpm ha:probe:multi -- --require-evidence",
                expectExit: 1,
                meaning: "EXIT=1 honesty fail-closed SUCCESS — Ban wash to pass"
              },
              artifactRecording: {
                design: "actions/upload-artifact name=ha-probe-multi-receipt",
                urlPatternActionsRun: "https://github.com/<owner>/<repo>/actions/runs/<run_id>#artifacts",
                urlPatternApi: "GET /repos/<owner>/<repo>/actions/runs/<run_id>/artifacts",
                liveGhaRunUrl: null,
                note: "Ban inventing live artifact URL until a real Actions run uploads one"
              },
              gR45Closed: true,
              coveredCount: 8,
              ms3EqualsR4Closed: false,
              status: "ci_stub_path_only_not_ladder_D"
            };
            fs.writeFileSync(dir + "/ci-probe-summary.json", JSON.stringify(summary, null, 2) + "\n");
            fs.writeFileSync(
              dir + "/ci-probe-summary.md",
              [
                "# HA D2 CI probe:multi — CI stub receipt",
                "",
                "- haStatus=NOT_HA",
                "- releaseEvidence=false",
                "- claimProductionHA=false",
                "- CI stub ≠ 阶 D ≠ production HA",
                "- stub probe expect EXIT=0 (CI-safe stub only)",
                "- --require-evidence expect EXIT=1 (honesty fail-closed SUCCESS)",
                "- live GHA artifact URL: none until real Actions run",
                ""
              ].join("\n")
            );
          '
          # Include any stub evidence files if present (kill receipts etc.)
          if [ -d .tmp/ha-evidence ] && [ "$(ls -A .tmp/ha-evidence 2>/dev/null)" ]; then
            mkdir -p .tmp/ha-ci-probe-artifact/ha-evidence
            cp -a .tmp/ha-evidence/. .tmp/ha-ci-probe-artifact/ha-evidence/ || true
          fi

      - name: Upload probe receipt artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ha-probe-multi-receipt
          path: .tmp/ha-ci-probe-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Final pin (Ban claim 阶 D / production HA)
        run: |
          echo "=== HA D2 CI probe:multi job complete ==="
          echo "haStatus=NOT_HA"
          echo "releaseEvidence=false"
          echo "claimProductionHA=false"
          echo "CI stub green ≠ 阶 D green ≠ production HA"
          echo "Artifact: ha-probe-multi-receipt (see Actions run Artifacts tab / API)"
          echo "Artifact URL pattern: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
          echo "Ban invent green · Ban wash EXIT=1 into green · Ban claim workflow land alone = 阶 D"
