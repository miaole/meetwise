name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 密钥扫描（全历史；项目有 Langfuse key 泄露史，必须真跑、red 即阻断）
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # 全历史，否则只扫到 HEAD
      - name: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        # 命中任何密钥 → 非零退出 → 阻断
      # FIX-G3 / #178 残留：全仓合并冲突标记扫描（git 跟踪文件；排除二进制与 vendor 类目录）。
      # 先跑种植 proof（三种标记必中、二进制/vendor/近似串不中、非 git 目录退出 2），再扫本仓；任一非零即阻断。
      # 放在 secrets-scan（已是必过检查）里，纯新增 step，不动 verify 的既有顺序。
      - name: 合并冲突标记全仓扫描（<<<<<<< / ======= / >>>>>>> 整行；排除二进制与 vendor）
        run: |
          node scripts/conflict-marker-scan.proof.mjs
          node scripts/conflict-marker-scan.mjs

  # 轻量 verify（2026-11-11 用户决定「CI 轻量，重要的校验、核心够用就行」）：
  # PR / main push 只跑 install · docs:check · arch · typecheck · lint · 核心 DB 门 · 无库单元 prove。
  # 原 verify 105 步逐条分类见 ai-docs/architecture/devops/ci-cd.md §8（保留 / nightly / 本地手跑），无一静默删除；
  # 移出的 prove 脚本全部保留在仓库，本地一条命令复跑：`pnpm db:up && pnpm verify:local`。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://meetwise:meetwise_dev_password@localhost:54329/meetwise
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # 全历史：迁移编号唯一性门要读父提交的迁移目录（浅克隆 = migration_parent_unreadable 机械红）。
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        # 版本读 package.json packageManager(pnpm@10.18.0)：catalog 需 pnpm≥9.5，不能再钉 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 文档门禁：必需文件 + 关键术语
      - run: pnpm docs:check

      # 模块边界 / 包 DAG（跨包 @meetwise/* 经 tsconfig paths 真解析，边界规则真生效；无需 Postgres）
      - name: 架构边界（无环 / 依赖向下 / ai-graphs 纯 / ai-runtime 关口）
        run: pnpm arch

      # #96 typecheck 门（CI-WIRING 收窄裁形·零错域先点亮→清债刀五债包 strict 清零点亮·Ban 例外授权扩容）：执行面 EXIT=0 + dry=json 选择面双向断言。
      # 选择面恰 = //#typecheck(root e2e) + web + contracts + api/worker/db/ai-runtime/domain 五债包 = 八任务（五债包 typecheck script 已点亮且 tsc 错数 0 后纳门·扩容随清债先后·禁预扩未点亮包）。
      # 选择面漂移（任务增减·零错域被摘除）= 红 = fail-loud。
      - name: typecheck gate (turbo zero-error domains · #96 narrowed)
        run: |
          pnpm turbo run typecheck --dry=json > /tmp/turbo-typecheck-dry.json
          node -e "const d=require('/tmp/turbo-typecheck-dry.json');const lit=d.tasks.filter((t)=>t.task==='typecheck'&&t.command!=='<NONEXISTENT>').map((t)=>t.taskId).sort();const expect=['//#typecheck','@meetwise/ai-runtime#typecheck','@meetwise/api#typecheck','@meetwise/contracts#typecheck','@meetwise/db#typecheck','@meetwise/domain#typecheck','@meetwise/web#typecheck','@meetwise/worker#typecheck'];if(JSON.stringify(lit)!==JSON.stringify(expect)){console.error('typecheck selection-face drift: '+lit.join(','));process.exit(1);}console.log('typecheck selection-face OK (zero-error domains + five strict-debt packages lit): '+lit.join(', '));"
          pnpm turbo typecheck

      # #96 LINT S3-S5 点亮（lint-design §1.5·四规则 warn 态零修复点亮）：turbo lint 全量绿 = per-workspace
      # "lint": "eslint . --max-warnings N"（N=现行预算·点亮日 dlx dry-run 基线随清债刀上调·与各 workspace
      # package.json lint script 恰等：api 1421/web 601/worker 954/ai-graphs 47/ai-runtime 628/config 0/contracts 265/db-mysql 0/db 1042/domain 115/qdrant-store 27/root 5235）——
      # 存量不破门、潜增即红；error 恒红（点亮日 dry-run 实测 error=0）。
      - name: lint gate (turbo lint · #96 LINT S3-S5 lit)
        run: pnpm turbo lint

      # 核心 DB 门（四原语 CAS / 幂等 / RLS 越权=0 / 事件 seq + 迁移编号唯一 + 迁移运行器）。
      # 起 Postgres（复用 dev compose，与本地同一映射端口）
      - run: pnpm db:up

      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec meetwise-postgres-dev pg_isready -U meetwise -d meetwise && exit 0
            sleep 2
          done
          echo "postgres not ready"; exit 1

      # 可复跑验证 gate（红即阻断合并）
      - name: 四原语（CAS / 幂等 / RLS 越权=0 / 事件 seq）
        run: pnpm db:prove

      - name: 迁移编号唯一性门（数值前缀·#140 修法②·豁免登记面·MIG-RUNNER 裁决项③ 本刀落码·CI-WIRING 只登记接线）
        run: node scripts/check-migration-version-uniqueness.mjs

      - name: 版本化迁移运行器（只跑待应用·幂等·事务·漂移检测·advisory锁）
        run: pnpm migrate:prove

      # 无库单元 prove（确定性、秒级；放在 db:up 之后，即便个别脚本探测本地库也不受影响）。
      - name: 无库单元 prove（dispatch / SSE / 图 / 检索 / 评分数学 / 鉴权 / 契约 / 前端逻辑）
        run: |
          pnpm interview-dispatch:unit:prove
          pnpm interview-dispatch:gate:prove
          pnpm quiz-dual-claim:unit:prove
          pnpm owner-drain-order:unit:prove
          pnpm last-event-id:unit:prove
          pnpm model-slot-bypass:static:prove
          pnpm sse-slot:prove
          pnpm -C apps/web prove:middleware
          pnpm failover:prove
          pnpm adaptive-signals:prove
          pnpm adaptive-signals-graph:prove
          pnpm signal-sse:prove
          pnpm signal-sse-contract:prove
          pnpm signal-sse-worker:prove
          pnpm grounded:prove
          pnpm crag:prove
          pnpm tools:prove
          pnpm critique:prove
          pnpm adaptive-graph:prove
          pnpm web-explore:prove
          pnpm retrieval:prove
          pnpm scoring-eval:prove
          pnpm security:prove
          pnpm auth:prove
          pnpm vstream:prove
          pnpm api:smoke
          pnpm web:prove
          pnpm pipeline:prove

      # 全栈跨进程 HTTP E2E 不进 CI（用户决定：不配 MODEL_API_KEY），本地手跑 `pnpm e2e:isolated`。
      # nightly（nightly-ciw2.yml）只放少量关键无 key 隔离 prove：容器构建 / compose 校验 / 旧库升级 / schema 漂移 /
      # 跨用户授权 / commerce saga / 隐私删除暂停 / 评分完整性 / 面试端到端 / 请求路径+SSE。
      # 其余 prove 移出 CI，本地 `pnpm db:up && pnpm verify:local`（与原 verify 同序）。
