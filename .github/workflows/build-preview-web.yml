name: build-preview-web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - scripts/package-preview-web-release.mjs
      - scripts/preview-loopback-readiness.proof.mjs
      - ops/ecs/**
      - ops/bootstrap/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/build-preview-web.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: build-preview-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies without lifecycle scripts
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify public copy before building the public artifact
        run: |
          python3 ops/bootstrap/test_first_root_bootstrap.py
          pnpm --filter @meetwise/web prove:public-copy
          node scripts/ecs-preview-config.proof.mjs
          node scripts/preview-loopback-readiness.proof.mjs
          node scripts/preview-edge-probe-fence.proof.mjs
          node scripts/preview-publication-recovery.proof.mjs
          node scripts/preview-release-manifest.proof.mjs
          node scripts/preview-release-control-plane.proof.mjs
      - name: Build the no-data Web release
        run: pnpm --filter @meetwise/web build
      - name: Package the Web release and its controller bundle
        run: |
          mkdir -p dist/controller
          commit="$(git rev-parse "$GITHUB_SHA")"
          tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          node scripts/package-preview-web-release.mjs "$commit" "$tree" dist
          tar --format=gnu --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist -czf dist/meetwise-preview-web.tar.gz release
          tar --format=gnu --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C . -czf dist/meetwise-preview-controller.tar.gz ops/ecs
          node ops/ecs/archive-safety.mjs validate dist/meetwise-preview-web.tar.gz release
          node ops/ecs/archive-safety.mjs validate dist/meetwise-preview-controller.tar.gz ops/ecs
          sha256sum dist/meetwise-preview-web.tar.gz dist/meetwise-preview-controller.tar.gz > dist/SHA256SUMS
      - name: Attest the immutable Web and controller archives
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/meetwise-preview-web.tar.gz
            dist/meetwise-preview-controller.tar.gz
      - name: Retain the attested delivery archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meetwise-preview-release-${{ github.sha }}
          path: |
            dist/meetwise-preview-web.tar.gz
            dist/meetwise-preview-controller.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
