name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tag 与版本单一来源必须一致：防"tag 说 v0.1.0、package.json 却写 0.1.1"的漂移。
      - name: 校验 tag 与版本一致
        run: |
          TAG="${{ github.ref_name }}"
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag($TAG) 与 package.json 版本($VER) 不一致" >&2
            exit 1
          fi

      # CHANGELOG 必须含对应版本段：防"版本 bump 了但 CHANGELOG 静默没收敛"。
      - name: 校验 CHANGELOG 含对应版本段
        run: |
          VER="$(node -p "require('./package.json').version")"
          if ! grep -q "## \\[${VER}\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 [${VER}] 段" >&2
            exit 1
          fi

      - run: pnpm docs:check

      - run: pnpm arch
