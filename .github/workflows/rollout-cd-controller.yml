name: rollout-cd-controller

on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Exact protected main commit to roll out
        required: true
        type: string

concurrency:
  group: full-stack-deploy
  cancel-in-progress: false

jobs:
  rollout:
    if: github.repository == 'miaole/meetwise'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-cd
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the requested commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.main_sha }}
          persist-credentials: false

      - name: Prove the receiver, root rollback, and workflow contract
        run: node scripts/ecs-cd-controller-rollout.proof.mjs

      - name: Verify protected main and successful CI for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'controller_main_sha_invalid' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$MAIN_SHA" ]] || { echo 'controller_checkout_sha_mismatch' >&2; exit 1; }
          main_json="$(gh api "repos/$GITHUB_REPOSITORY/branches/main")"
          [[ "$(jq -r '.commit.sha' <<<"$main_json")" == "$MAIN_SHA" ]] || { echo 'controller_main_sha_not_current' >&2; exit 1; }
          [[ "$(jq -r '.protected' <<<"$main_json")" == true ]] || { echo 'controller_main_not_protected' >&2; exit 1; }
          workflow_inventory="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          ci_count="$(jq '[.[].workflows[] | select(.name == "ci")] | length' <<<"$workflow_inventory")"
          [[ "$ci_count" == 1 ]] || { echo 'controller_ci_workflow_not_unique' >&2; exit 1; }
          ci_workflow_id="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].id' <<<"$workflow_inventory")"
          ci_path="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].path' <<<"$workflow_inventory")"
          [[ "$ci_path" == .github/workflows/ci.yml && "$ci_workflow_id" =~ ^[1-9][0-9]*$ ]] || { echo 'controller_ci_workflow_identity_invalid' >&2; exit 1; }
          runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100")"
          success_count="$(jq --arg sha "$MAIN_SHA" --argjson workflow "$ci_workflow_id" '[.[].workflow_runs[] | select(.workflow_id == $workflow and .head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
          [[ "$success_count" -ge 1 ]] || { echo 'controller_ci_success_missing' >&2; exit 1; }

      - name: Build the canonical controller bundle
        id: bundle
        env:
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          bundle_dir="$(mktemp -d)"
          trap 'rm -rf -- "$bundle_dir"' EXIT
          mkdir -p "$bundle_dir/payload"
          manifest="$bundle_dir/manifest.txt"
          files="$bundle_dir/files.txt"
          : > "$manifest"
          : > "$files"
          while IFS='|' read -r source destination mode; do
            [[ -n "$source" && "$source" != \#* ]] || continue
            [[ "$source" != *$'\n'* && "$source" != *'|'* && "$destination" == /* && "$mode" =~ ^0[0-7]{3}$ ]] || { echo 'controller_manifest_row_invalid' >&2; exit 1; }
            [[ -f "$source" && ! -L "$source" ]] || { echo "controller_source_invalid:$source" >&2; exit 1; }
            source_hash="$(sha256sum "$source" | awk '{print $1}')"
            printf '%s|%s|%s|%s\n' "$source" "$destination" "$mode" "$source_hash" >> "$manifest"
            payload="$bundle_dir/payload/$source"
            mkdir -p "$(dirname "$payload")"
            cp -- "$source" "$payload"
            chmod "$mode" "$payload"
            printf 'payload/%s\n' "$source" >> "$files"
          done < ops/ecs/full-stack/cd-controller-files.txt
          [[ -s "$manifest" ]] || { echo 'controller_manifest_empty' >&2; exit 1; }
          printf 'manifest.txt\n' > "$bundle_dir/archive-files.txt"
          cat "$files" >> "$bundle_dir/archive-files.txt"
          bundle_digest="$(sha256sum "$manifest" | awk '{print $1}')"
          archive="$RUNNER_TEMP/meetwise-controller-${bundle_digest}.tar.gz"
          GZIP=-n tar --format=gnu --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='go+u,go-w' -czf "$archive" -C "$bundle_dir" --files-from "$bundle_dir/archive-files.txt"
          archive_digest="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'bundle_digest=%s\n' "$bundle_digest" >> "$GITHUB_OUTPUT"
          printf 'archive_digest=%s\n' "$archive_digest" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'main_sha=%s\n' "$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Connect the protected tailnet and configure forced-command SSH
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:meetwise-cd

      - name: Configure SSH to the provisioned controller receiver
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.ECS_CD_DEPLOY_KEY }}" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.ECS_CD_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          {
            printf 'Host meetwise-ecs\n'
            printf '  HostName %s\n' "${{ secrets.ECS_CD_SSH_HOST }}"
            printf '  User meetwise-cd\n'
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
            printf '  ConnectTimeout 30\n'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Verify forced-command sentinel before sensitive ECS SSH
        run: |
          set -euo pipefail
          sentinel_status=0
          sentinel_output="$(ssh -o BatchMode=yes -o LogLevel=ERROR meetwise-ecs 'meetwise-cd __meetwise_cd_forced_command_sentinel__' 2>&1)" || sentinel_status=$?
          [[ "$sentinel_status" -ne 0 && "$sentinel_output" == 'meetwise_cd_unknown_command' ]] || {
            echo 'forced-command sentinel did not fail closed with the exact unknown-command reason' >&2
            exit 1
          }

      - name: Receive the candidate bundle (stage only)
        env:
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.bundle_digest }}
          ARCHIVE_DIGEST: ${{ steps.bundle.outputs.archive_digest }}
          ARCHIVE: ${{ steps.bundle.outputs.archive }}
        run: |
          set -euo pipefail
          ssh meetwise-ecs "meetwise-cd receive-controller $BUNDLE_DIGEST $ARCHIVE_DIGEST" < "$ARCHIVE"

      - name: Install the candidate bundle atomically with rollback
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.bundle_digest }}
          ARCHIVE_DIGEST: ${{ steps.bundle.outputs.archive_digest }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'controller_main_sha_invalid_before_install' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$MAIN_SHA" ]] || { echo 'controller_checkout_sha_mismatch_before_install' >&2; exit 1; }
          main_json="$(gh api "repos/$GITHUB_REPOSITORY/branches/main")"
          [[ "$(jq -r '.commit.sha' <<<"$main_json")" == "$MAIN_SHA" ]] || {
            echo 'controller_main_sha_stale_before_install_stage_left_uninstalled' >&2
            exit 1
          }
          [[ "$(jq -r '.protected' <<<"$main_json")" == true ]] || { echo 'controller_main_not_protected_before_install' >&2; exit 1; }
          workflow_inventory="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          ci_count="$(jq '[.[].workflows[] | select(.name == "ci")] | length' <<<"$workflow_inventory")"
          [[ "$ci_count" == 1 ]] || { echo 'controller_ci_workflow_not_unique_before_install' >&2; exit 1; }
          ci_workflow_id="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].id' <<<"$workflow_inventory")"
          ci_path="$(jq -r '[.[].workflows[] | select(.name == "ci")][0].path' <<<"$workflow_inventory")"
          [[ "$ci_path" == .github/workflows/ci.yml && "$ci_workflow_id" =~ ^[1-9][0-9]*$ ]] || { echo 'controller_ci_workflow_identity_invalid_before_install' >&2; exit 1; }
          runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100")"
          success_count="$(jq --arg sha "$MAIN_SHA" --argjson workflow "$ci_workflow_id" '[.[].workflow_runs[] | select(.workflow_id == $workflow and .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
          [[ "$success_count" -ge 1 ]] || {
            echo 'controller_ci_success_missing_before_install_stage_left_uninstalled' >&2
            exit 1
          }
          ssh meetwise-ecs "meetwise-cd install-controller $BUNDLE_DIGEST $ARCHIVE_DIGEST"
          ssh meetwise-ecs 'meetwise-cd bootstrap-toolchain'
          installed="$(ssh meetwise-ecs 'meetwise-cd controller-version')"
          [[ "$installed" == "$BUNDLE_DIGEST" ]] || { echo 'controller_version_readback_mismatch' >&2; exit 1; }
          printf 'controller_version=%s\n' "$installed"
