name: pages-preview

on:
  push:
    branches: [main]
    paths:
      - preview-site/**
      - ops/ecs/keys/preview-release-ed25519.pub.pem
      - scripts/build-preview-directory.mjs
      - scripts/fetch-preview-release-manifest.mjs
      - ops/ecs/preview-release-manifest.mjs
      - .github/workflows/pages-preview.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify static preview directory
        run: node preview-site/preview-directory.proof.mjs
      - name: Verify the disabled-by-default ECS preview configuration
        run: node scripts/ecs-preview-config.proof.mjs
      - name: Verify the signed HTTPS preview origin
        id: origin
        run: |
          endpoint="$(tr -d '\n' < preview-site/preview-manifest-origin.txt)"
          if node scripts/fetch-preview-release-manifest.mjs "$endpoint" .preview-release-manifest.json && node scripts/verify-preview-origin.mjs .preview-release-manifest.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build a signed-release-aware static directory
        run: |
          if [ "${{ steps.origin.outputs.enabled }}" = "true" ]; then
            node scripts/build-preview-directory.mjs .pages-preview .preview-release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem
          elif [ -f .preview-release-manifest.json ]; then
            node scripts/build-preview-directory.mjs .pages-preview .preview-release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem --force-disabled
          else
            node scripts/build-preview-directory.mjs .pages-preview preview-site/release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem --force-disabled
          fi
      - name: Upload the only public artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-preview

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
