name: pages-preview

on:
  push:
    branches: [main]
    paths:
      - preview-site/**
      - ops/ecs/keys/preview-release-ed25519.pub.pem
      - ops/ecs/controller-lib.sh
      - ops/ecs/preview-edge-probe-fence.mjs
      - ops/ecs/preview-release-ledger.mjs
      - ops/ecs/preview-publication-recovery.mjs
      - ops/ecs/preview-release-manifest.mjs
      - ops/ecs/reconcile-preview-publication.sh
      - ops/ecs/revoke-preview-pages-link.sh
      - scripts/build-preview-directory.mjs
      - scripts/fetch-preview-release-manifest.mjs
      - scripts/verify-preview-origin.mjs
      - ops/ecs/full-stack/nginx-meetwise-full-stack.conf
      - ops/ecs/full-stack/full-stack-preview-publisher.mjs
      - scripts/full-stack-preview-publisher.proof.mjs
      - scripts/ecs-preview-config.proof.mjs
      - scripts/preview-edge-probe-fence.proof.mjs
      - scripts/preview-publication-recovery.proof.mjs
      - .github/workflows/pages-preview.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      expected_state:
        description: 'Receipt state required by the caller (disabled or enabled)'
        required: false
        type: string
        default: ''
      expected_generation:
        description: 'Release generation that the receipt must publish'
        required: false
        type: string
        default: ''
      expected_manifest_sha256:
        description: 'Final manifest fingerprint that the receipt must publish'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify static preview directory
        run: node preview-site/preview-directory.proof.mjs
      - name: Verify the disabled-by-default ECS preview configuration
        run: |
          node scripts/ecs-preview-config.proof.mjs
          node scripts/preview-edge-probe-fence.proof.mjs
      - name: Verify crash-safe public-manifest reconciliation
        run: |
          node scripts/preview-publication-recovery.proof.mjs
          node scripts/cd-pages-receipt.proof.mjs
      - name: Verify the signed HTTPS preview origin
        id: origin
        env:
          MANIFEST_ENDPOINT: ${{ vars.ECS_FULL_STACK_MANIFEST_URL }}
          EXPECTED_STATE: ${{ inputs.expected_state }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          # 真实 manifest URL 是非敏感的公开 HTTPS 地址，由 repository variable 注入；
          # 不依赖 gitignored 文件（GitHub clean checkout 永远没有该文件）。
          endpoint="$MANIFEST_ENDPOINT"
          if [ -n "$endpoint" ]; then
            if node scripts/fetch-preview-release-manifest.mjs "$endpoint" .preview-release-manifest.json; then
              echo "fetched=true" >> "$GITHUB_OUTPUT"
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { manifestFingerprint } from './ops/ecs/preview-release-manifest.mjs';
          const expectedState = process.env.EXPECTED_STATE;
          const expectedGeneration = process.env.EXPECTED_GENERATION;
          const expectedFingerprint = process.env.EXPECTED_MANIFEST_SHA256;
          const manifest = JSON.parse(await readFile('.preview-release-manifest.json', 'utf8'));
          const fingerprint = manifestFingerprint(manifest);
          if (expectedState && !['disabled', 'enabled'].includes(expectedState)) throw new Error('pages_expected_state_invalid');
          if ((expectedGeneration || expectedFingerprint) && (!expectedGeneration || !expectedFingerprint)) throw new Error('pages_expected_identity_incomplete');
          if (expectedGeneration && String(manifest.generation) !== expectedGeneration) throw new Error('pages_manifest_generation_mismatch');
          if (expectedFingerprint && fingerprint !== expectedFingerprint) throw new Error('pages_manifest_fingerprint_mismatch');
          if (expectedState === 'enabled' && (manifest.status !== 'verified' || manifest.revoked !== false)) throw new Error('pages_expected_enabled_manifest_invalid');
          if (expectedState === 'disabled' && manifest.status === 'verified' && manifest.revoked === false) throw new Error('pages_expected_disabled_manifest_invalid');
          console.log(JSON.stringify({ state: expectedState || (manifest.status === 'verified' && manifest.revoked === false ? 'enabled' : 'disabled'), generation: manifest.generation ?? null, fingerprint }));
          NODE
              if { [ -z "$EXPECTED_STATE" ] || [ "$EXPECTED_STATE" = "enabled" ]; } && node scripts/verify-preview-origin.mjs .preview-release-manifest.json; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "fetched=false" >> "$GITHUB_OUTPUT"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build a signed-release-aware static directory
        run: |
          if [ "$EXPECTED_STATE" = "disabled" ] && [ "${{ steps.origin.outputs.fetched }}" = "true" ]; then
            node scripts/build-preview-directory.mjs .pages-preview .preview-release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem --force-disabled
          elif [ "${{ steps.origin.outputs.enabled }}" = "true" ]; then
            node scripts/build-preview-directory.mjs .pages-preview .preview-release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem
          elif [ "${{ steps.origin.outputs.fetched }}" = "true" ]; then
            # The signed record still owns the destination. A verified,
            # unexpired, non-revoked record may keep the directory link visible
            # while a newly deployed Web build awaits its successor receipt;
            # build-preview-directory independently rejects revoked/expired
            # records and never accepts an unsigned URL.
            node scripts/build-preview-directory.mjs .pages-preview .preview-release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem
          else
            node scripts/build-preview-directory.mjs .pages-preview preview-site/release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem --force-disabled
          fi
        env:
          EXPECTED_STATE: ${{ inputs.expected_state }}

      - name: Stamp and verify the Pages receipt identity
        env:
          EXPECTED_STATE: ${{ inputs.expected_state }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { manifestFingerprint } from './ops/ecs/preview-release-manifest.mjs';
          const path = '.pages-preview/preview-link-state.json';
          const state = JSON.parse(await readFile(path, 'utf8'));
          let manifest = null;
          try { manifest = JSON.parse(await readFile('.preview-release-manifest.json', 'utf8')); } catch { /* no live endpoint on an unconfigured static run */ }
          const fingerprint = manifest ? manifestFingerprint(manifest) : state.manifestSha256;
          const generation = manifest?.generation ?? null;
          const expectedState = process.env.EXPECTED_STATE;
          const artifactState = expectedState === 'enabled' ? 'verified' : expectedState;
          if (artifactState && state.state !== artifactState) throw new Error('pages_receipt_state_mismatch');
          if (process.env.EXPECTED_GENERATION && String(generation) !== process.env.EXPECTED_GENERATION) throw new Error('pages_receipt_generation_mismatch');
          if (process.env.EXPECTED_MANIFEST_SHA256 && fingerprint !== process.env.EXPECTED_MANIFEST_SHA256) throw new Error('pages_receipt_fingerprint_mismatch');
          if (manifest && state.manifestSha256 !== fingerprint) throw new Error('pages_receipt_manifest_mismatch');
          const stamped = { ...state, state: expectedState || state.state, generation, finalFingerprint: fingerprint };
          await writeFile(path, `${JSON.stringify(stamped)}\n`);
          console.log(JSON.stringify(stamped));
          NODE
      - name: Upload the only public artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-preview

  # A failed validation must not leave the previous enabled Pages artifact in
  # place. Publish a fresh disabled artifact whenever packaging cannot complete;
  # when an exact caller identity was supplied, the live signed manifest is
  # fetched only to preserve its generation/fingerprint in the disabled receipt.
  package-disabled:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.verify-and-package.result != 'success'
    needs: verify-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Fetch the live manifest for an exact disabled receipt
        id: disabled-origin
        env:
          MANIFEST_ENDPOINT: ${{ vars.ECS_FULL_STACK_MANIFEST_URL }}
          EXPECTED_STATE: ${{ inputs.expected_state }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          if [ -n "$MANIFEST_ENDPOINT" ] && node scripts/fetch-preview-release-manifest.mjs "$MANIFEST_ENDPOINT" .preview-release-manifest.json; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            if [ -n "$EXPECTED_MANIFEST_SHA256" ] || [ -n "$EXPECTED_GENERATION" ]; then
              echo 'cannot publish an exact disabled receipt without the live manifest' >&2
              exit 1
            fi
          fi
      - name: Build a disabled directory after any validation failure
        env:
          FETCHED: ${{ steps.disabled-origin.outputs.fetched }}
        run: |
          if [ "$FETCHED" = "true" ]; then
            node scripts/build-preview-directory.mjs .pages-preview .preview-release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem --force-disabled
          else
            node scripts/build-preview-directory.mjs .pages-preview preview-site/release-manifest.json ops/ecs/keys/preview-release-ed25519.pub.pem --force-disabled
          fi
      - name: Stamp and verify the disabled receipt identity
        env:
          EXPECTED_STATE: ${{ inputs.expected_state }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          FETCHED: ${{ steps.disabled-origin.outputs.fetched }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { manifestFingerprint } from './ops/ecs/preview-release-manifest.mjs';
          const path = '.pages-preview/preview-link-state.json';
          const state = JSON.parse(await readFile(path, 'utf8'));
          const manifest = process.env.FETCHED === 'true' ? JSON.parse(await readFile('.preview-release-manifest.json', 'utf8')) : null;
          const fingerprint = manifest ? manifestFingerprint(manifest) : state.manifestSha256;
          const generation = manifest?.generation ?? null;
          if (state.state !== 'disabled') throw new Error('pages_disabled_receipt_state_invalid');
          if (process.env.EXPECTED_STATE && process.env.EXPECTED_STATE !== 'disabled') throw new Error('pages_disabled_receipt_expected_state_invalid');
          if (process.env.EXPECTED_GENERATION && String(generation) !== process.env.EXPECTED_GENERATION) throw new Error('pages_disabled_receipt_generation_mismatch');
          if (process.env.EXPECTED_MANIFEST_SHA256 && fingerprint !== process.env.EXPECTED_MANIFEST_SHA256) throw new Error('pages_disabled_receipt_fingerprint_mismatch');
          if (manifest && state.manifestSha256 !== fingerprint) throw new Error('pages_disabled_receipt_manifest_mismatch');
          await writeFile(path, `${JSON.stringify({ ...state, generation, finalFingerprint: fingerprint })}\n`);
          NODE
      - name: Upload the disabled artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-preview

  deploy:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.verify-and-package.result == 'success' || needs.package-disabled.result == 'success')
    needs: [verify-and-package, package-disabled]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Wait for the exact Pages receipt
        if: ${{ inputs.expected_state != '' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_STATE: ${{ inputs.expected_state }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          page_url="${PAGE_URL%/}"
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 "$page_url/preview-link-state.json?generation=$EXPECTED_GENERATION&manifest=$EXPECTED_MANIFEST_SHA256" -o /tmp/pages-link-state.json; then
            if node --input-type=module - <<'NODE'
            import { readFile } from 'node:fs/promises';
            const state = JSON.parse(await readFile('/tmp/pages-link-state.json', 'utf8'));
            const expected = { state: process.env.EXPECTED_STATE, generation: process.env.EXPECTED_GENERATION, fingerprint: process.env.EXPECTED_MANIFEST_SHA256 };
            if (state.state !== expected.state || String(state.generation) !== expected.generation || state.manifestSha256 !== expected.fingerprint || state.finalFingerprint !== expected.fingerprint) process.exit(1);
          NODE
            then
              echo 'Pages exact generation/final fingerprint receipt confirmed'
              exit 0
            fi
            fi
            sleep 5
          done
          echo 'Pages exact generation/final fingerprint receipt did not arrive' >&2
          exit 1
