name: nightly-live-model
# 真模型质量门 —— 唯一能证明"AI 真可用"(非桩)的层。对真实境内模型跑,故 secrets 门控 + 定时,
# 不放 per-push CI(qwen ~20s/次、偶发 30s×重试会拖慢并制造假红)。未配 secrets → 每步 skip(不假红);
# 配了 secrets → 真跑,红即"真模型/真链路出问题"的信号(正是 per-push 假模型门测不出的那层)。
on:
  schedule:
    - cron: '0 18 * * *'      # 每日 UTC 18:00(≈北京 02:00)
  workflow_dispatch: {}        # 配好 secrets 后可随时手动触发验证

permissions:
  contents: read

jobs:
  live-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:up
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec meetwise-postgres-dev pg_isready -U meetwise -d meetwise && exit 0
            sleep 2
          done
          echo "postgres not ready"; exit 1

      # ── 门位如实:冒烟=硬门阻断(红=真模型出题/评分/报告质量或关口出问题)·recall/scoring=信号臂(continue-on-error,红=信号不阻断) ──
      - name: 真模型冒烟(文本 qwen:出题/评分/报告经 invoke 关口双校验真跑)
        env:
          MODEL_ENDPOINT_PROFILE: deepseek-cn-public
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then echo "::warning::未配 MODEL_API_KEY → 跳过真模型门(配 secrets 后 nightly/手动才真跑)"; exit 0; fi
          touch .env # CI checkout 无 .env·脚本顶层 readFileSync 需占位文件(空文件即可·key 仍走 env 注入)
          pnpm model:smoke
      # 视觉 OCR 在 MODEL-OP-01 前由代码全环境 fail-closed；不得在 nightly
      # 读取 Key、简历图片或原始模型输出。恢复前需 typed binding + 合成 fixture
      # + 脱敏回执，不能把 continue-on-error 的人工 smoke 当作验证。
      # Voice/OCR live smoke is intentionally absent. MODEL-OP-01 must first
      # establish typed operation binding, media budgets, deletion receipts,
      # redacted synthetic fixtures and non-unknown attempt handling.
      - name: 检索召回金标(qbank:retrieval:eval:真 embedding 召回率达标)
        continue-on-error: true
        env:
          DASHSCOPE_EMBED_API_KEY: ${{ secrets.DASHSCOPE_EMBED_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_EMBED_API_KEY" ]; then echo "::warning::未配 DASHSCOPE_EMBED_API_KEY → 跳过 qbank:retrieval:eval(配 secrets 后 nightly/手动才真跑)"; exit 0; fi
          touch .env # CI checkout 无 .env·脚本顶层 readFileSync 需占位文件(空文件即可·key 仍走 env 注入)
          pnpm qbank:retrieval:eval
      - name: 评分官质量信号(scoring:eval:单调性/一致性ICC/相关性,真模型;度量数学硬门在 per-push ci)
        continue-on-error: true
        env:
          MODEL_ENDPOINT_PROFILE: deepseek-cn-public
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MODEL_FAST_NAME: ${{ secrets.MODEL_FAST_NAME }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then echo "::warning::未配 MODEL_API_KEY → 跳过 scoring:eval(配 secrets 后 nightly/手动才真跑)"; exit 0; fi
          pnpm scoring:eval

  # FIX-G3 / #98：全栈 E2E 进 nightly（独立 job，不改 live-model 既有 step）。
  # 与 ci.yml 的 e2e-isolated 同一命令；nightly 这份保证即使 PR 上被取消/未跑，每天也有一次完整结果。
  # 硬门：缺 MODEL_API_KEY → ::error:: + 退出 1（全栈 E2E 禁止 skip-if-absent，与 live-model 的跳过约定不同）。
  # G2（generation_duplicate_question）合并前本 job 会红，这是已知且预期的信号。
  e2e-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 全栈 E2E（pnpm e2e:isolated · 真模型 · 一次性隔离 PG · 缺 Key 即红）
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MODEL_FAST_NAME: ${{ secrets.MODEL_FAST_NAME }}
          # 留空时 runner 默认 dashscope-cn-beijing（scripts/e2e-live-capability-env.mjs）
          MODEL_ENDPOINT_PROFILE: ${{ vars.E2E_MODEL_ENDPOINT_PROFILE }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "::error::未配置 secrets.MODEL_API_KEY → 全栈 E2E 没有运行（未跑 ≠ 绿，按 #98 规则判红）"
            exit 1
          fi
          [ -n "$MODEL_NAME" ] || unset MODEL_NAME
          [ -n "$MODEL_FAST_NAME" ] || unset MODEL_FAST_NAME
          [ -n "$MODEL_ENDPOINT_PROFILE" ] || unset MODEL_ENDPOINT_PROFILE
          pnpm e2e:isolated
