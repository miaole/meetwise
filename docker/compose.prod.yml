services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["sh", "-c", "pnpm -C packages/db migrate && pnpm -C apps/worker cost:configure"]
    restart: "no"
    environment: *migration-env
    secrets: [rds_ca]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["pnpm", "-C", "apps/api", "serve"]
    environment:
      <<: *cloud-runtime-env
      PORT: "8787"
      HOST: 0.0.0.0
    secrets: [rds_ca]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8787:8787"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["pnpm", "-C", "apps/worker", "start"]
    environment:
      <<: [*cloud-runtime-env, *worker-native-model-env]
      # Text provider credentials are Worker-only.  Primary and backup are
      # different provider secrets; no API service receives either key.
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY from the cloud secret manager}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME}
      MODEL_FAST_NAME: ${MODEL_FAST_NAME:?set MODEL_FAST_NAME}
      MODEL_BACKUP_BASE_URL: ${MODEL_BACKUP_BASE_URL:?set MODEL_BACKUP_BASE_URL}
      MODEL_BACKUP_API_KEY: ${MODEL_BACKUP_API_KEY:?set MODEL_BACKUP_API_KEY from the cloud secret manager}
      MODEL_BACKUP_NAME: ${MODEL_BACKUP_NAME:?set MODEL_BACKUP_NAME}
      MODEL_FAST_BACKUP_NAME: ${MODEL_FAST_BACKUP_NAME:?set MODEL_FAST_BACKUP_NAME}
      WORKER_BOOTSTRAP: "1"
      WORKER_JOB_RECONCILE_INTERVAL_MS: ${WORKER_JOB_RECONCILE_INTERVAL_MS:-5000}
      # This credential is mounted only into the worker.  It can build and
      # promote qbank generations but has no request-path app_role membership.
      QBANK_CONTROL_DATABASE_URL: ${QBANK_CONTROL_DATABASE_URL:?set dedicated qbank control database URL}
      RAG_CONTROL_DATABASE_URL: ${RAG_CONTROL_DATABASE_URL:?set dedicated generic RAG control database URL}
      # Prometheus is a sibling on this private compose network.  Do not map
      # 9091 to the host/public internet; `expose` below is container-only.
      WORKER_METRICS_HOST: 0.0.0.0
    secrets: [rds_ca]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "9091"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?set public API base URL}
      PORT: "3000"
    depends_on:
      api:
        condition: service_started
    ports:
