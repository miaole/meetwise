  MODEL_PRIMARY_INPUT_MICRO_CNY_PER_MILLION: ${MODEL_PRIMARY_INPUT_MICRO_CNY_PER_MILLION:?set MODEL_PRIMARY_INPUT_MICRO_CNY_PER_MILLION}
  MODEL_PRIMARY_OUTPUT_MICRO_CNY_PER_MILLION: ${MODEL_PRIMARY_OUTPUT_MICRO_CNY_PER_MILLION:?set MODEL_PRIMARY_OUTPUT_MICRO_CNY_PER_MILLION}
