services:
  migrate:
    <<: *container-runtime-security
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE = <registry>/<namespace>/meetwise-backend@sha256:<digest>}
    # The runtime image must not invoke the mutable Corepack/pnpm shim.  Keep
    # the migration and cost-ledger configuration in the package workspaces so
    # Node resolves their workspace-local tsx/@swc-node dependencies exactly as
    # the package scripts do, without downloading anything at container start.
    working_dir: /app/packages/db
    command: ["sh", "-c", "node node_modules/tsx/dist/cli.mjs src/migrate-cli.ts && cd /app/apps/worker && node --import @swc-node/register/esm-register src/cost-configure.ts"]
    restart: "no"
    environment: *migration-env
    secrets: [rds_ca]

  api:
    <<: *container-runtime-security
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE = <registry>/<namespace>/meetwise-backend@sha256:<digest>}
    working_dir: /app/apps/api
    command: ["node", "--import", "@swc-node/register/esm-register", "src/main.ts"]
    environment:
      <<: *cloud-runtime-env
      PORT: "8787"
      HOST: 0.0.0.0
    secrets: [rds_ca]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # 宿主回环绑定：api 不 0.0.0.0 暴露（0.0.0.0 会绕过 funnel/edge-close 直连 tailnet）。
      # 宿主上只有 loader.mjs（synthetic-verify）需要经 127.0.0.1:8787 打 api；web/worker/Prometheus
      # 走 compose 私网 `api:8787`。公网唯一入口仍是 funnel → nginx:80 → web:3000。
      - "127.0.0.1:8787:8787"
    # 单机 4G 预览：崩溃自动拉起（对齐原 systemd Restart=on-failure）+ 内存硬顶。
    # 为什么 mem_limit 而非 deploy.resources：compose 非 swarm 下 deploy.resources 被忽略。
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    <<: *container-runtime-security
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE = <registry>/<namespace>/meetwise-backend@sha256:<digest>}
    working_dir: /app/apps/worker
    command: ["node", "--import", "@swc-node/register/esm-register", "src/main.ts"]
    environment:
      <<: [*cloud-runtime-env, *worker-native-model-env]
      # Text provider credentials are Worker-only.  Primary and backup are
      # different provider secrets; no API service receives either key.
      # BAILIAN-04: endpoint 不再接受自由 URL；改为受控版本化 profile id（闭集注册表）。
      MODEL_ENDPOINT_PROFILE: ${MODEL_ENDPOINT_PROFILE:-deepseek-cn-public}
      MODEL_BACKUP_ENDPOINT_PROFILE: ${MODEL_BACKUP_ENDPOINT_PROFILE:-dashscope-cn-beijing}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY from the cloud secret manager}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME}
      MODEL_FAST_NAME: ${MODEL_FAST_NAME:?set MODEL_FAST_NAME}
      MODEL_BACKUP_API_KEY: ${MODEL_BACKUP_API_KEY:?set MODEL_BACKUP_API_KEY from the cloud secret manager}
      MODEL_BACKUP_NAME: ${MODEL_BACKUP_NAME:?set MODEL_BACKUP_NAME}
      MODEL_FAST_BACKUP_NAME: ${MODEL_FAST_BACKUP_NAME:?set MODEL_FAST_BACKUP_NAME}
      # F1 fix: 备用端点启用（MODEL_BACKUP_API_KEY 挂载）后，worker 启动时
      # resolveModelCostGovernance() 会按 MODEL_BACKUP_* / MODEL_FAST_BACKUP_* 解析并校验
      # 两条备份费用行。这些计费字段过去只写在 x-migration-env（供 migrate 服务写账本），
      # worker 块缺失 → 启动即抛 model_cost_invalid_model_backup_billing_model。
      # 它们是**非密计费名/数值**（provider/model/region/revision/费率/来源 URL/窗口），
      # 不含任何 API Key，故放在 worker 块与备份 Key 并列，绝不进 API（API 仍无备份 Key）。
      MODEL_BACKUP_BILLING_PROVIDER: ${MODEL_BACKUP_BILLING_PROVIDER:?set MODEL_BACKUP_BILLING_PROVIDER}
      MODEL_BACKUP_BILLING_MODEL: ${MODEL_BACKUP_BILLING_MODEL:?set MODEL_BACKUP_BILLING_MODEL}
      MODEL_BACKUP_BILLING_REGION: ${MODEL_BACKUP_BILLING_REGION:?set MODEL_BACKUP_BILLING_REGION}
      MODEL_BACKUP_PRICE_REVISION: ${MODEL_BACKUP_PRICE_REVISION:?set MODEL_BACKUP_PRICE_REVISION}
      MODEL_BACKUP_INPUT_MICRO_CNY_PER_MILLION: ${MODEL_BACKUP_INPUT_MICRO_CNY_PER_MILLION:?set MODEL_BACKUP_INPUT_MICRO_CNY_PER_MILLION}
      MODEL_BACKUP_OUTPUT_MICRO_CNY_PER_MILLION: ${MODEL_BACKUP_OUTPUT_MICRO_CNY_PER_MILLION:?set MODEL_BACKUP_OUTPUT_MICRO_CNY_PER_MILLION}
      MODEL_BACKUP_PRICE_SOURCE_URL: ${MODEL_BACKUP_PRICE_SOURCE_URL:?set MODEL_BACKUP_PRICE_SOURCE_URL}
      MODEL_BACKUP_MAX_INPUT_TOKENS: ${MODEL_BACKUP_MAX_INPUT_TOKENS:-16000}
      MODEL_BACKUP_MAX_OUTPUT_TOKENS: ${MODEL_BACKUP_MAX_OUTPUT_TOKENS:-4000}
      MODEL_BACKUP_CONTEXT_WINDOW_TOKENS: ${MODEL_BACKUP_CONTEXT_WINDOW_TOKENS:?set MODEL_BACKUP_CONTEXT_WINDOW_TOKENS}
      MODEL_BACKUP_CONTEXT_ESTIMATOR: ${MODEL_BACKUP_CONTEXT_ESTIMATOR:-utf8-bytes-v1}
      MODEL_BACKUP_CONTEXT_SAFETY_MARGIN_TOKENS: ${MODEL_BACKUP_CONTEXT_SAFETY_MARGIN_TOKENS:?set MODEL_BACKUP_CONTEXT_SAFETY_MARGIN_TOKENS}
      MODEL_FAST_BACKUP_BILLING_PROVIDER: ${MODEL_FAST_BACKUP_BILLING_PROVIDER:?set MODEL_FAST_BACKUP_BILLING_PROVIDER}
      MODEL_FAST_BACKUP_BILLING_MODEL: ${MODEL_FAST_BACKUP_BILLING_MODEL:?set MODEL_FAST_BACKUP_BILLING_MODEL}
      MODEL_FAST_BACKUP_BILLING_REGION: ${MODEL_FAST_BACKUP_BILLING_REGION:?set MODEL_FAST_BACKUP_BILLING_REGION}
      MODEL_FAST_BACKUP_PRICE_REVISION: ${MODEL_FAST_BACKUP_PRICE_REVISION:?set MODEL_FAST_BACKUP_PRICE_REVISION}
      MODEL_FAST_BACKUP_INPUT_MICRO_CNY_PER_MILLION: ${MODEL_FAST_BACKUP_INPUT_MICRO_CNY_PER_MILLION:?set MODEL_FAST_BACKUP_INPUT_MICRO_CNY_PER_MILLION}
      MODEL_FAST_BACKUP_OUTPUT_MICRO_CNY_PER_MILLION: ${MODEL_FAST_BACKUP_OUTPUT_MICRO_CNY_PER_MILLION:?set MODEL_FAST_BACKUP_OUTPUT_MICRO_CNY_PER_MILLION}
      MODEL_FAST_BACKUP_PRICE_SOURCE_URL: ${MODEL_FAST_BACKUP_PRICE_SOURCE_URL:?set MODEL_FAST_BACKUP_PRICE_SOURCE_URL}
      MODEL_FAST_BACKUP_MAX_INPUT_TOKENS: ${MODEL_FAST_BACKUP_MAX_INPUT_TOKENS:-16000}
      MODEL_FAST_BACKUP_MAX_OUTPUT_TOKENS: ${MODEL_FAST_BACKUP_MAX_OUTPUT_TOKENS:-4000}
      MODEL_FAST_BACKUP_CONTEXT_WINDOW_TOKENS: ${MODEL_FAST_BACKUP_CONTEXT_WINDOW_TOKENS:?set MODEL_FAST_BACKUP_CONTEXT_WINDOW_TOKENS}
      MODEL_FAST_BACKUP_CONTEXT_ESTIMATOR: ${MODEL_FAST_BACKUP_CONTEXT_ESTIMATOR:-utf8-bytes-v1}
      MODEL_FAST_BACKUP_CONTEXT_SAFETY_MARGIN_TOKENS: ${MODEL_FAST_BACKUP_CONTEXT_SAFETY_MARGIN_TOKENS:?set MODEL_FAST_BACKUP_CONTEXT_SAFETY_MARGIN_TOKENS}
      # BAILIAN-03: 文本 Key 轮换残留机械校验（可选指纹 + 撤销清单）。
      MODEL_API_KEY_FINGERPRINT: ${MODEL_API_KEY_FINGERPRINT:-}
      MODEL_BACKUP_API_KEY_FINGERPRINT: ${MODEL_BACKUP_API_KEY_FINGERPRINT:-}
      MODEL_REVOKED_KEY_FINGERPRINTS: ${MODEL_REVOKED_KEY_FINGERPRINTS:-}
      WORKER_BOOTSTRAP: "1"
      WORKER_JOB_RECONCILE_INTERVAL_MS: ${WORKER_JOB_RECONCILE_INTERVAL_MS:-5000}
      # This credential is mounted only into the worker.  It can build and
      # promote qbank generations but has no request-path app_role membership.
      QBANK_CONTROL_DATABASE_URL: ${QBANK_CONTROL_DATABASE_URL:?set dedicated qbank control database URL}
      RAG_CONTROL_DATABASE_URL: ${RAG_CONTROL_DATABASE_URL:?set dedicated generic RAG control database URL}
      # Metrics 由独立的 docker/compose.monitoring.yml 抓取（单机 4G 预览不常驻
      # Prometheus）。Do not map 9091 to the host/public internet; `expose` 仅容器网络。
      WORKER_METRICS_HOST: 0.0.0.0
    secrets: [rds_ca]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "9091"
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/readyz/worker').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    <<: *container-runtime-security
    image: ${WEB_IMAGE:?set WEB_IMAGE = <registry>/<namespace>/meetwise-web@sha256:<digest>}
    environment:
      # 浏览器侧公开源（如 funnel host）：仅用于导出下载直链等 client 可见地址。
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?set public API base URL}
      # 服务端直连 api：serverFetch / 同源 SSE 代理在 web 容器内运行，必须走 compose 私网
      # `api:8787`（容器内 127.0.0.1 是自身回环，不是宿主）。缺失会回退到 NEXT_PUBLIC_API_BASE
      # 造成经公网 funnel 自环或失败。
      API_BASE_INTERNAL: http://api:8787
      PORT: "3000"
      # Production web stays refuse-closed even if an operator exports 1.
      # isOcrPreviewEnabled locks on NODE_ENV=production, enforce, or public preview.
      OCR_ENABLED: ${OCR_ENABLED:-0}
      OCR_PREVIEW: ${OCR_PREVIEW:-0}
      MODEL_COST_ENFORCEMENT: ${MODEL_COST_ENFORCEMENT:-enforce}
      MEETWISE_PUBLIC_PREVIEW: ${MEETWISE_PUBLIC_PREVIEW:-0}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 宿主回环绑定：web 只由宿主 nginx 代理（funnel → nginx:80 → 127.0.0.1:3000），
      # 不 0.0.0.0 暴露，避免绕过 funnel/edge-close 直连 tailnet。
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

secrets:
  rds_ca:
    file: ${RDS_CA_HOST_PATH:?set RDS_CA_HOST_PATH to an uncommitted PEM file}
