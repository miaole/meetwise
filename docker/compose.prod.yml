  MODEL_FAST_INPUT_MICRO_CNY_PER_MILLION: ${MODEL_FAST_INPUT_MICRO_CNY_PER_MILLION:?set MODEL_FAST_INPUT_MICRO_CNY_PER_MILLION}
  MODEL_FAST_OUTPUT_MICRO_CNY_PER_MILLION: ${MODEL_FAST_OUTPUT_MICRO_CNY_PER_MILLION:?set MODEL_FAST_OUTPUT_MICRO_CNY_PER_MILLION}
  MODEL_FAST_PRICE_SOURCE_URL: ${MODEL_FAST_PRICE_SOURCE_URL:?set MODEL_FAST_PRICE_SOURCE_URL}
  MODEL_FAST_MAX_INPUT_TOKENS: ${MODEL_FAST_MAX_INPUT_TOKENS:-16000}
  MODEL_FAST_MAX_OUTPUT_TOKENS: ${MODEL_FAST_MAX_OUTPUT_TOKENS:-4000}
  MODEL_FAST_CONTEXT_WINDOW_TOKENS: ${MODEL_FAST_CONTEXT_WINDOW_TOKENS:?set MODEL_FAST_CONTEXT_WINDOW_TOKENS}
