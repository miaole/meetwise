# Prometheus 抓取 + 告警评估配置。
# 抓 api 的 /metrics(文本 exposition),按 alert.rules.yml 评估,命中推给 alertmanager。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: meetwise

# 规则文件(告警规则)。相对本文件所在目录挂载在容器内。
rule_files:
  - alert.rules.yml

# 命中的告警发往 alertmanager(同 compose 网络内按服务名解析)。
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # api 与 Prometheus 在同一个 production compose 私网，通过服务名抓取；
  # 不使用 host.docker.internal，避免云主机/独立容器的宿主机回环盲区。
  - job_name: meetwise-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - api:8787

  # worker 侧指标(队列健康 gauge + 模型熔断/退款失败 counter)。worker 自挂 /metrics(默认 9091)。
  # worker 只通过 compose 私网 expose 该端口，不映射到宿主机或公网。
  # 抓取合成的 up{job="meetwise-worker"} 即 worker 存活数据源(WorkerTargetDown/WorkerScrapeMissing 告警据此)。
  - job_name: meetwise-worker
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - worker:9091

  # Prometheus 自监控(可用性 / 规则评估健康)。
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Alertmanager 自监控(接收端存活)。
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
