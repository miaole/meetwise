# HA-1 LB（compose 内 api 入口·容器网 only）— upstream 双后端 + 被动探活。
# 挂载点：docker/compose.ha.yml lb service → /etc/nginx/conf.d/default.conf（read_only bind）。
#
# 诚实边界：haStatus=NOT_HA · 本 LB 只服务 api-a/api-b 双后端的 compose 内入口，不落宿主端口；
# web 入口 LB 在宿主 nginx（ops/deploy/nginx.conf upstream web_pool）。
#
# SSE 对齐宿主 nginx 既有面（ops/deploy/nginx.conf:12-22）：proxy_buffering off + read_timeout 3600s
# 全局生效（LB 只反代 api，api 侧 SSE 面 /interview/* events 同样零缓冲长超时——一刀全局最简且不弱化）。
#
# 分流观测通道：add_header X-HA-Upstream $upstream_addr always —— 响应可辨命中后端（与 INSTANCE_ID
# printenv 收据 + docker inspect IP 映射构成机器可判分流实证；产品码零改）。
#
# 被动探活：max_fails=3 / fail_timeout=10s —— 连续 3 次失败摘除 10s，期间 proxy_next_upstream
# （默认 error timeout）把连接失败请求即时转交存活后端（connect refused 秒级转交，请求零失败窗口）。

upstream api_pool {
    server api-a:8787 max_fails=3 fail_timeout=10s;
    server api-b:8787 max_fails=3 fail_timeout=10s;
}

server {
    listen 8787;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass http://api_pool;
        proxy_buffering off;   # SSE 流式零缓冲（对齐宿主 nginx 既有面）
        add_header X-HA-Upstream $upstream_addr always;
    }
}
