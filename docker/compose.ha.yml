# HA-1 REDUNDANCY overlay — R-17 单机单副本→单机多副本（compose 内进程级冗余拓扑本体）。
#
#   haStatus=NOT_HA · releaseEvidence=false · claimProductionHA=false —— 本文件只交付拓扑本体
#   与判定面，不翻转任何 pin；「生产 100% HA」叙事仍受 north-star-ha.md 证据阶梯与七硬闸约束。
#   单机宿主仍是 SPOF（宿主级冗余归 S15/B4 终裁）；est live=0：生产宿主应用本拓扑须协调方另行授权。
#
# 用法（-f 合载，零原地改 compose.prod.yml —— 治理先例 compose.prod.override.yml:1-6）：
#   docker compose -f docker/compose.prod.yml -f docker/compose.ha.yml config
#   docker compose -f docker/compose.prod.yml -f docker/compose.ha.yml up -d
#
# RX-1（rev2 §9-1 硬前置）：compose -f 合载【不会移除】compose.prod.yml 的原 api/worker/web 三
#   service——端口冲突 up 必败，或改绑端口后静默 3× 拓扑假绿。本叠加层以 profiles 覆盖停用原三
#   service（下方三个 `profiles: ["ha-disabled"]` 单键重定义·其余键经合并原样继承）；默认不带
#   --profile ha-disabled 启动时原三 service 不参与 up/ps。ha-status.mjs 副本计数按显式服务名
#   清单（api-a/api-b/web-a/web-b/worker-a/worker-b/lb）并附「原三 service 不在 running」排除断言。
#
# RX-2（rev2 §9-2）：web-a/web-b 逐 service 显式 HOSTNAME: "0.0.0.0"——env 按 service 名合并，
#   新 service 名不继承原 web 的 env；缺 HOSTNAME 时 standalone server 会拿容器 ID 当监听地址，
#   healthcheck 恒 unhealthy（复踩既有坑）。
#
# RX-3（rev2 §9-3）：api-a/api-b 注 INSTANCE_ID（分流观测通道·先例 compose.ha-dual.yml:75/:88）。
#   产品码零读 INSTANCE_ID（本刀零改产品码基线）：分流实证走 LB 侧 X-HA-Upstream 响应头 +
#   $upstream_addr 日志（机器可判），INSTANCE_ID 以 printenv 收据留痕。
#
# 资源裁决（§2.1-6 / §5-4 二择一·EXEC 落卷）：选①「宿主升 4c8g」。per-replica mem_limit 与
#   compose.prod.yml 现值逐项相同（api 512m/worker 1g/web 512m）+ lb 64m，全拓扑预算 4.0625G：
#   超现 2c4g/4G 预览信封、入 W2 对照（w2-resource-sizing-receipts.md:32）的 4c8g 档。
#   理由：减半（选②）会把 OOM 可用性风险永久烘进生产叠加工件——恰是 HA 要修的面；本刀 est live=0
#   不落生产宿主，故不构成对现 4G 宿主的静默超售；**任何生产应用/翻转前必须先完成宿主升 4c8g**，
#   该前置随预算表（receipts/ha-1/resource-budget.json）入 B4/S15 终裁继承面。
#
# web-b 宿主回环端口旋钮：默认 3001（REQUEST §2.1-3 契约值不变）。旋钮只为沙箱让路——本机 3001
#   被无关进程占用时沙箱以 MEETWISE_HA_WEB_B_HOST_PORT=13001 旁路；生产 env 不设即 3001。
#
# 治理诚实注记（rev2 §9-10）：本叠加层沿 compose.prod.override.yml 既有「非治理运行时旋钮」惯例，
#   惯例无仪式；日后升格治理契约另行裁定。
#
# 漂移风险注记：YAML 锚不跨文件，下方 x-ha-*-env/x-ha-runtime-security 为 compose.prod.yml 同名锚
#   的逐字镜像（prod 锚仍是单一真相）；改 prod 锚须同步本镜像——ha-status.mjs 不校验锚一致性，
#   漂移由 rev2 复审与人审把守。

x-ha-runtime-security: &ha-runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

x-ha-cloud-runtime-env: &ha-cloud-runtime-env
  NODE_ENV: production
  DATABASE_URL: ${RUNTIME_DATABASE_URL:?set RUNTIME_DATABASE_URL from the cloud secret manager}
  DATABASE_SSL_MODE: verify-full
  DATABASE_SSL_CA_PATH: /run/secrets/rds_ca
  PGPOOL_MAX: "12"
  WEB_ORIGIN: ${WEB_ORIGIN:?set the public HTTPS web origin}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET from the cloud secret manager}
  PAY_PROVIDER_SECRET: ${PAY_PROVIDER_SECRET:?set PAY_PROVIDER_SECRET from the cloud secret manager}
  RESUME_ENC_KEY: ${RESUME_ENC_KEY:?set RESUME_ENC_KEY from the cloud secret manager}
  RESUME_HASH_SECRET: ${RESUME_HASH_SECRET:?set RESUME_HASH_SECRET from the cloud secret manager}
  OCR_ENABLED: ${OCR_ENABLED:-0}
  OCR_PREVIEW: ${OCR_PREVIEW:-0}
  MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-30000}
  MODEL_EXECUTION_TIMEOUT_MS: ${MODEL_EXECUTION_TIMEOUT_MS:-35000}
  MODEL_INVOCATION_WAIT_MS: ${MODEL_INVOCATION_WAIT_MS:-35000}
  MODEL_INVOCATION_RECONCILE_AFTER_MS: ${MODEL_INVOCATION_RECONCILE_AFTER_MS:-120000}
